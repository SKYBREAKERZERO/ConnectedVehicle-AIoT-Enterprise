name: Pinned IaC test toolchain
description: Install the isolated IaC toolchain; Terraform only for native phases.
inputs:
  terraform:
    description: Install pinned Terraform for a real native phase
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
    with:
      python-version: '3.12'
  - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
    if: inputs.terraform == 'true'
    with:
      terraform_version: 1.14.7
      terraform_wrapper: false
  - shell: bash
    run: python -m pip install --disable-pip-version-check -r scripts/iac/requirements.txt
