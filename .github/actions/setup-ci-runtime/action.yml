name: Pinned Runtime test toolchain
description: Install the application and its actual quality/test dependencies.
runs:
  using: composite
  steps:
  - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
    with:
      python-version: '3.12'
  - shell: bash
    run: python -m pip install --disable-pip-version-check -e ".[dev]"
