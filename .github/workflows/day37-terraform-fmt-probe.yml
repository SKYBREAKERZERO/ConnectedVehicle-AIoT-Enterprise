name: Day37 temporary Terraform fmt probe
'on':
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fmt:
    if: ${{ github.event.pull_request.head.ref == 'feat/day37-p1-audit-20261107' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      with:
        terraform_version: '1.14.7'
        terraform_wrapper: false
    - name: Canonical fmt and emit encoded exact sources
      run: |
        set -euo pipefail
        terraform fmt infra/terraform/environments/ota-staging-foundation/main.tf infra/terraform/environments/ota-staging-identity/main.tf
        python - <<'PY'
        import base64
        from pathlib import Path
        for path in (
            Path('infra/terraform/environments/ota-staging-foundation/main.tf'),
            Path('infra/terraform/environments/ota-staging-identity/main.tf'),
        ):
            b64=base64.b64encode(path.read_bytes()).decode()
            print('CV_TFFMT_START',path.as_posix(),len(b64))
            for i in range(0,len(b64),3500):
                print('CV_TFFMT_PART',path.as_posix(),i//3500,b64[i:i+3500])
            print('CV_TFFMT_END',path.as_posix())
        PY
        terraform fmt -check infra/terraform/environments/ota-staging-foundation/main.tf infra/terraform/environments/ota-staging-identity/main.tf
