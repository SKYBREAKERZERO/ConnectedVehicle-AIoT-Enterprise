name: Day40 Runtime Security Closed Loop
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
concurrency:
  group: day40-runtime-security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  intake:
    name: 01 Event-bound candidate and baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      baseline: ${{ steps.source.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: source
        run: python -m scripts.iac.ci_baseline_policy --output .iac-reports/day31-baseline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day40-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: .iac-reports/day31-baseline.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    name: 02 Full Python quality and release policy
    needs: intake
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-runtime
      - name: Require full-repository lint, formatting, and types
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy .
          mkdir -p .reports
          python -m pytest -q tests/unit/test_day40_rotation_audit.py \
            tests/unit/test_day40_runtime_evidence.py tests/unit/test_day37_preflight.py \
            tests/unit/enterprise_platform/test_cache_client.py \
            --junitxml=.reports/quality.xml
      - name: Seal policy regression report
        run: |
          python -m scripts.iac.pipeline_evidence publish \
            --stage quality --folder .reports --output .sealed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day40-proof-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  postgres:
    name: 03 PostgreSQL rotation and rollback
    needs: intake
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-runtime
      - name: Run isolated real-service integration
        run: |
          set -euo pipefail
          mkdir -p .reports
          export RUNTIME_EVIDENCE_DIR="$RUNNER_TEMP/day40-runtime"
          docker info --format '{{.ServerVersion}}'
          python -m pytest tests/integration/day12/test_credential_rotation.py -q --junitxml=.reports/postgres.xml
      - name: Seal same-attempt report
        run: |
          python -m scripts.iac.pipeline_evidence publish \
            --stage postgres --folder .reports --output .sealed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day40-proof-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  redis:
    name: 04 Redis TLS, token overlap and client replacement
    needs: intake
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-runtime
      - name: Run isolated real-service integration
        run: |
          set -euo pipefail
          mkdir -p .reports
          export RUNTIME_EVIDENCE_DIR="$RUNNER_TEMP/day40-runtime"
          docker info --format '{{.ServerVersion}}'
          python -m pytest tests/integration/day40/test_redis_tls_rotation.py -q --junitxml=.reports/redis.xml
      - name: Seal same-attempt report
        run: |
          python -m scripts.iac.pipeline_evidence publish \
            --stage redis --folder .reports --output .sealed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day40-proof-redis-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  terraform:
    name: 05 Native Terraform validation / ${{ matrix.root }}
    needs: intake
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [ota-staging, ota-staging-foundation, ota-staging-identity]
    env:
      TF_ROOT: infra/terraform/environments/${{ matrix.root }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.14.7'
          terraform_wrapper: false
      - name: Validate without backend or deployment credentials
        run: |
          set -euo pipefail
          mkdir -p .reports
          terraform -chdir="$TF_ROOT" fmt -check -recursive
          terraform -chdir="$TF_ROOT" init -backend=false -lockfile=readonly -input=false -no-color
          terraform -chdir="$TF_ROOT" validate -json > .reports/validate.json
      - name: Seal native Terraform result
        run: |
          python -m scripts.iac.pipeline_evidence publish \
            --stage terraform-${{ matrix.root }} --folder .reports --output .sealed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day40-proof-terraform-${{ matrix.root }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  scan:
    name: 06 Checkov deployment source and CI fixture
    needs: intake
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: day40-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: .iac-reports
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.intake.outputs.baseline }}
          path: baseline
          persist-credentials: false
      - name: Run unmodified IaC security policy
        run: |
          set -euo pipefail
          python -m scripts.iac.gate --baseline baseline --phase security --report .reports/checkov.json
      - name: Seal both scan targets
        run: |
          python -m scripts.iac.pipeline_evidence publish \
            --stage scan --folder .reports --output .sealed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day40-proof-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  evidence:
    name: 07 Independently verify rotation and IaC evidence
    needs: [quality, postgres, redis, terraform, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: day40-proof-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .incoming
      - name: Verify required test cases and recompute artifact hashes
        run: |
          set -euo pipefail
          mkdir -p .reports
          python -m scripts.day40_runtime_evidence assemble --folder .incoming --output .reports/aggregate.json
      - name: Seal independently verified aggregate
        run: |
          python -m scripts.iac.pipeline_evidence publish \
            --stage aggregate --folder .reports --output .sealed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day40-proof-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  gate:
    name: 08 Day40 acceptance and AWS release boundary
    needs: [intake, quality, postgres, redis, terraform, scan, evidence]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ needs.evidence.result == 'success' }}
        with:
          name: day40-proof-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verified
      - name: Record both local and AWS decisions
        if: ${{ !cancelled() }}
        env:
          PIPELINE_NEEDS: ${{ toJSON(needs) }}
        run: python -m scripts.day40_runtime_evidence finalize --folder .verified --output .final/decision.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && hashFiles('.final/decision.json') != '' }}
        with:
          name: day40-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: .final/decision.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
