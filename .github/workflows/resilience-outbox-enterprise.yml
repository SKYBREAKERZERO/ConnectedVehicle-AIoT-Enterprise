# Candidate CI: test results are untrusted until the protected workflow_run
# verifies them using default-branch verifier code (see trusted workflow).
# All CB test modules are MANDATORY and do not exist on current main; fail closed.
name: Outbox Dispatcher Enterprise Runtime

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outbox-enterprise-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: 01 Contracts, retry budget and circuit states
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project with test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify candidate checkout and quality
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy .
      - name: Run mandatory unit and contract tests
        run: |
          set -euo pipefail
          mkdir -p .outbox-contract
          python -m pytest -q --strict-markers \
            tests/contract/test_contract_gate.py \
            tests/contract/test_alembic_migration_lineage.py \
            tests/unit/enterprise_platform/test_reliability_retry.py \
            tests/unit/enterprise_platform/test_outbox_dispatcher.py \
            tests/unit/test_transaction_recovery.py \
            tests/unit/enterprise_platform/test_circuit_breaker.py \
            --junitxml=.outbox-contract/results.xml
      - name: Bind contract report to execution identity
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/contract
          if test -f .outbox-contract/results.xml; then
            cp .outbox-contract/results.xml ci-evidence/contract/results.xml
            python scripts/ci/outbox_evidence.py generate \
              --suite contract \
              --junit ci-evidence/contract/results.xml \
              --output ci-evidence/contract/manifest.json
          fi
      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outbox-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/contract/
          if-no-files-found: warn
          retention-days: 30

  postgres_runtime:
    name: 02 PostgreSQL 17 claims, RLS and shared circuit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cluster_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-only
          POSTGRES_DB: outbox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cluster_bootstrap -d outbox_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: local
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_NAME: outbox_test
      DATABASE_USERNAME: migration_owner
      DATABASE_PASSWORD: ci-schema-only
      BOOTSTRAP_DATABASE_USERNAME: cluster_bootstrap
      BOOTSTRAP_DATABASE_PASSWORD: ci-bootstrap-only
      MIGRATION_DATABASE_USERNAME: migration_owner
      MIGRATION_DATABASE_PASSWORD: ci-schema-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project with test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Bootstrap independent management identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m database.bootstrap_cluster
      - name: Verify single Alembic head and migrate as owner
        run: |
          set -euo pipefail
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          assert len(heads) == 1, heads
          PY
          python -m alembic upgrade head
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from enterprise_platform.config.settings import get_settings
          from enterprise_platform.database.engine import create_database_engine

          async def verify():
              engine = create_database_engine(get_settings())
              try:
                  async with engine.connect() as con:
                      version = int(await con.scalar(text('SHOW server_version_num')))
                      assert 170000 <= version < 180000, version
                      identity = (await con.execute(text('SELECT session_user, current_user'))).one()
                      assert identity[0] == identity[1] == 'migration_owner', identity
              finally:
                  await engine.dispose()
          asyncio.run(verify())
          PY
      - name: Real claims, atomicity, RLS and Circuit recovery
        run: |
          set -euo pipefail
          mkdir -p .outbox-pg
          python -m pytest -q --strict-markers \
            tests/integration/reliability/test_outbox_claim_lease.py \
            tests/integration/reliability/test_transactional_outbox.py \
            tests/integration/security/test_database_runtime_permissions.py \
            tests/integration/reliability/test_outbox_circuit_pg.py \
            --junitxml=.outbox-pg/results.xml
      - name: Bind PostgreSQL report to execution identity
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/pg
          if test -f .outbox-pg/results.xml; then
            cp .outbox-pg/results.xml ci-evidence/pg/results.xml
            python scripts/ci/outbox_evidence.py generate \
              --suite pg --junit ci-evidence/pg/results.xml \
              --output ci-evidence/pg/manifest.json
          fi
      - name: Upload PostgreSQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outbox-pg-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/pg/
          if-no-files-found: warn
          retention-days: 30

  delivery_runtime:
    name: 03 LocalStack fault injection and business isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cluster_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-only
          POSTGRES_DB: outbox_delivery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cluster_bootstrap -d outbox_delivery_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      localstack:
        # Same pinned digest as the repository's existing runtime.yml baseline.
        image: localstack/localstack:3.8.1@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: us-east-1
          SQS_ENDPOINT_STRATEGY: path
        ports: ['4566:4566']
    env:
      APP_ENV: local
      CLOUD_RUNTIME: localstack
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_NAME: outbox_delivery_test
      DATABASE_USERNAME: migration_owner
      DATABASE_PASSWORD: ci-schema-only
      BOOTSTRAP_DATABASE_USERNAME: cluster_bootstrap
      BOOTSTRAP_DATABASE_PASSWORD: ci-bootstrap-only
      MIGRATION_DATABASE_USERNAME: migration_owner
      MIGRATION_DATABASE_PASSWORD: ci-schema-only
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project with test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Bootstrap and migrate PostgreSQL 17
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m database.bootstrap_cluster
          python -m alembic upgrade head
      - name: Wait for LocalStack SQS API readiness
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, random, time
          from urllib.parse import urlsplit
          import boto3
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError
          endpoint = os.environ['AWS_ENDPOINT_URL']
          parsed = urlsplit(endpoint)
          if parsed.scheme != 'http' or parsed.hostname not in ('127.0.0.1', 'localhost') or parsed.port != 4566:
              raise SystemExit('Refusing nonlocal LocalStack endpoint')
          client = boto3.client('sqs', endpoint_url=endpoint,
              region_name='us-east-1', config=Config(connect_timeout=2, read_timeout=3,
              retries={'max_attempts': 1}))
          for attempt in range(10):
              try:
                  client.list_queues()
                  print('LocalStack SQS API ready')
                  break
              except (BotoCoreError, ClientError) as exc:
                  if attempt == 9:
                      raise SystemExit(f'SQS API not ready: {type(exc).__name__}') from exc
                  time.sleep(random.uniform(0.1, min(0.5 * 2**attempt, 3)))
          PY
      - name: SQS API send/receive/delete smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from uuid import uuid4
          import boto3
          from botocore.config import Config
          c = boto3.client('sqs', endpoint_url=os.environ['AWS_ENDPOINT_URL'],
              region_name='us-east-1', config=Config(connect_timeout=2, read_timeout=5,
              retries={'max_attempts': 1}))
          url = c.create_queue(QueueName='outbox-ci-'+uuid4().hex[:12])['QueueUrl']
          try:
              message = c.send_message(QueueUrl=url, MessageBody='outbox-probe')['MessageId']
              rows = c.receive_message(QueueUrl=url, MaxNumberOfMessages=1,
                  WaitTimeSeconds=3).get('Messages', [])
              if len(rows) != 1 or rows[0]['MessageId'] != message:
                  raise SystemExit('LocalStack SQS round trip failed')
              c.delete_message(QueueUrl=url, ReceiptHandle=rows[0]['ReceiptHandle'])
          finally:
              c.delete_queue(QueueUrl=url)
          print('LocalStack SQS smoke PASS')
          PY
      - name: Run mandatory SQS, Circuit and isolation tests
        run: |
          set -euo pipefail
          mkdir -p .outbox-delivery
          python -m pytest -q --strict-markers \
            tests/integration/reliability/test_localstack_sqs_dlq.py \
            tests/integration/messaging/test_localstack_sqs.py \
            tests/integration/reliability/test_outbox_circuit_localstack.py \
            --junitxml=.outbox-delivery/results.xml
      - name: Bind delivery report to execution identity
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence/delivery
          if test -f .outbox-delivery/results.xml; then
            cp .outbox-delivery/results.xml ci-evidence/delivery/results.xml
            python scripts/ci/outbox_evidence.py generate \
              --suite delivery --junit ci-evidence/delivery/results.xml \
              --output ci-evidence/delivery/manifest.json
          fi
      - name: Upload delivery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outbox-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/delivery/
          if-no-files-found: warn
          retention-days: 30

  candidate_gate:
    # Fast branch-protection check. NOT a trusted release attestation.
    name: OUTBOX_CANDIDATE_EVIDENCE_GATE
    needs: [quality, postgres_runtime, delivery_runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require all test jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          d = json.loads(os.environ['NEEDS_JSON'])
          expected = {'quality', 'postgres_runtime', 'delivery_runtime'}
          if set(d) != expected or any(d[x]['result'] != 'success' for x in expected):
              raise SystemExit(f'OUTBOX CANDIDATE GATE BLOCKED: {d}')
          PY
      - name: Checkout candidate verifier code before downloading evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download contract report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: outbox-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/contract
      - name: Download PostgreSQL report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: outbox-pg-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/pg
      - name: Download delivery report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: outbox-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/delivery
      - name: Verify report hashes, source identity and mandatory cases
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_EVENT: ${{ github.event_name }}
        run: python3 scripts/ci/outbox_evidence.py verify --evidence-root ci-evidence