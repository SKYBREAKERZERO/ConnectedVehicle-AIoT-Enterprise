name: Day37 temporary read-only format probe
'on':
  push:
    branches: [feat/day37-p1-audit-20261107]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'feat/day37-p1-audit-20261107' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-runtime
      - name: Format scoped Day37 Python sources without modifying repository
        run: |
          set -euo pipefail
          ruff check --fix scripts/day37_*.py tests/unit/test_day37*.py || true
          ruff format scripts/day37_*.py tests/unit/test_day37*.py
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          paths = sorted(Path("scripts").glob("day37_*.py")) + sorted(Path("tests/unit").glob("test_day37*.py"))
          for path in paths:
              raw = path.read_bytes()
              b64 = base64.b64encode(raw).decode()
              chunks = [b64[i:i+4000] for i in range(0,len(b64),4000)]
              print(f"CV_BLOB_START {path.as_posix()} {hashlib.sha256(raw).hexdigest()} {len(chunks)}")
              for idx, chunk in enumerate(chunks):
                  print(f"CV_BLOB_PART {path.as_posix()} {idx} {chunk}")
              print(f"CV_BLOB_END {path.as_posix()}")
          PY
          ruff check scripts/day37_*.py tests/unit/test_day37*.py
