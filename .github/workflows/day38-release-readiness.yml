# Day38 — ConnectedVehicle-AIoT-Enterprise / enterprise release readiness.
# ============================================================================
# Security invariants (mandatory, not advisory):
# 01. PR, push, merge queue and manual audit never receive AWS OIDC tokens.
# 02. workflow_run uses immutable protected-main verifier code only.
# 03. Uploaded GitHub artifacts and all upstream jobs are untrusted claims.
# 04. All write operations, Terraform Apply/Destroy and AWS changes are forbidden.
# 05. A new failed or pending run overrides an older successful run.
# 06. Exact GITHUB_SHA, run_id, attempt and approved ancestor are bound.
# 07. Every required job has a unique, stable GitHub check-context name.
# 08. Failures, skipped jobs, cancelled runs and missing proof BLOCK release.
# 09. Infrastructure Secret versions and credentials never enter artifacts.
# 10. All metadata and manifests carry explicit release_authorized=false.
# 11. CI-on-PR is not an AWS deployment and never asserts AWS compliance.
# 12. Publishing a green workflow_run is not equivalent to PR CI acceptance.
# 13. A blocked Checkov exception or unresolved RDS TLS blocks final quality.
# 14. Job identity must be immutable; no shared concurrency cancellation.
# 15. Terraform provider init must not contact a real remote state backend.
# 16. The final decision is offline-only; Day37 retains deployment authority.
# 17. Fault injection tests must demonstrate the failure boundary actually fired.
# 18. Exact same-attempt artifact hash checks prevent replay or substitution.
# 19. Workflow files should use SHA-pinned actions and reviewable tool versions.
# 20. No checkout of the untrusted trigger SHA in the workflow_run observer.
# 21. A single YAML performs offline testing and trusted post-offline review.
# 22. No workflow_run self-subscription (would trigger recursive observation).
# 23. No job in a PR-editable workflow has actions:write or any write token.
# 24. Trusted-main schedule provides eventual recheck without token-based dispatch.
# 25. Manual recheck and workflow_run observers never rerun Terraform.
# ============================================================================
name: Day40 enterprise IaC release readiness

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only verification of trusted main; no IaC runs or AWS access'
        required: true
        type: choice
        options: [recheck]
        default: recheck
      source_commit:
        description: 'Optional offline source SHA; auto-filled by post-gate dispatch'
        required: false
        type: string
      source_run_id:
        description: 'Optional offline run ID; auto-filled by post-gate dispatch'
        required: false
        type: string
      source_attempt:
        description: 'Optional offline attempt; auto-filled by post-gate dispatch'
        required: false
        type: string
  schedule:
    # A read-only fallback: upstream workflows may finish before Day38 offline.
    # GitHub cron is best effort and may be delayed; never a release authorization.
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - IaC quality gates
      - Runtime quality gates
      - Day34 full OTA acceptance
      - Day35 full OTA acceptance
      - Day37 AWS Staging enterprise release (fail closed)
      - Day31 trust boundary
      - CI isolation fault matrix
    types: [completed]

# Do not give this workflow or its jobs id-token:write, deployments:write,
# packages:write, checks:write, pull-requests:write, or contents:write.
permissions:
  contents: read
  actions: read
  pull-requests: read

# Each individual run is retained as evidence even if another event uses
# the same commit SHA. Job/run cancellation can erase failure evidence.
concurrency:
  group: day38-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  DAY38_NO_AWS_AUTHORITY: 'true'

jobs:

  intake:
    name: Day38 immutable source intake
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact GitHub event source (no persisted token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install read-only Python verifier
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind immutable candidate and independent ancestor
        id: baseline
        run: |
          set -euo pipefail
          mkdir -p .day38-work .day38-reports
          python -m scripts.iac.ci_baseline_policy --output .day38-work/baseline.json
      - name: Require the correct source event and account
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise source > .day38-work/intake.json
          python -m json.tool .day38-work/intake.json > /dev/null
      - name: Record SHA-256 of actual baseline admission receipt
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise report \
            --stage day38-source \
            --proof .day38-work/baseline.json \
            --output .day38-reports/source.json
      - name: Seal source decision with same-attempt provenance
        run: |
          set -euo pipefail
          python -m scripts.iac.pipeline_evidence publish \
            --stage day38-source \
            --folder .day38-reports \
            --output .day38-sealed
      - name: Upload source proof (never a deployment credential)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  source_guard:
    name: Day38 source provenance and workflow trust
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs: [intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout event-bound source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Python interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Git identity and ancestry
        run: |
          set -euo pipefail
          git diff --check
          python -m scripts.day38_enterprise source
          python -m scripts.iac.ci_baseline_policy \
            --output .day38-source-verified.json
      - name: Check source identity cannot be substituted by an old SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m scripts.day38_enterprise source
          echo 'Verified event-bound checkout; workflow static policy is checked separately.' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Record immutable source binding
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git log -1 --format=%H
          echo 'Source trust is prerequisite, not release approval.' >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Day38 pinned dependency closure and compiler
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs: [intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned isolated IaC toolchain
        uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'false'
      - name: Check interpreter and dependency closure
        run: |
          set -euo pipefail
          mkdir -p .day38-work .day38-reports
          python --version > .day38-work/dependencies.log
          python -m pip check >> .day38-work/dependencies.log
          python -m compileall -q scripts/day38_readiness.py
          python -m compileall -q scripts/day38_enterprise.py
          python -m compileall -q scripts/iac
          python - <<'PY' >> .day38-work/dependencies.log
          from importlib.metadata import version
          for name in ('pytest', 'ruff', 'mypy', 'checkov'):
              print(f'{name}: {version(name)}')
          PY

      - name: Bind successful command output to stage receipt
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise report \
            --stage day38-dependencies \
            --proof .day38-work/dependencies.log \
            --output .day38-reports/dependencies.json
      - name: Seal independent stage evidence
        run: |
          set -euo pipefail
          python -m scripts.iac.pipeline_evidence publish \
            --stage day38-dependencies \
            --folder .day38-reports \
            --output .day38-sealed
      - name: Upload stage result, not state or secrets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  python_quality:
    name: Day38 Python Ruff, formatting and strict typing
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs: [intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned quality tools
        uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'false'
      - name: Run actual Ruff, formatting and mypy checks
        run: |
          set -euo pipefail
          mkdir -p .day38-work .day38-reports
          {
            ruff check scripts/iac scripts/day38_readiness.py scripts/day38_enterprise.py
            ruff format --check scripts/iac scripts/day38_readiness.py scripts/day38_enterprise.py
            mypy scripts/iac scripts/day38_readiness.py scripts/day38_enterprise.py
          } 2>&1 | tee .day38-work/python-quality.log
          test -s .day38-work/python-quality.log

      - name: Bind successful command output to stage receipt
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise report \
            --stage day38-python-quality \
            --proof .day38-work/python-quality.log \
            --output .day38-reports/python-quality.json
      - name: Seal independent stage evidence
        run: |
          set -euo pipefail
          python -m scripts.iac.pipeline_evidence publish \
            --stage day38-python-quality \
            --folder .day38-reports \
            --output .day38-sealed
      - name: Upload stage result, not state or secrets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-python-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  terraform_format:
    name: Day38 Terraform global fmt and lock inventory
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs: [intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed Terraform source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Terraform version
        uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'true'
      - name: Format check every root and module
        run: |
          set -euo pipefail
          mkdir -p .day38-work .day38-reports
          terraform version > .day38-work/terraform-format.log
          terraform fmt -check -recursive infra/terraform >> .day38-work/terraform-format.log
      - name: Reject unreviewed Terraform root exclusions
        run: |
          set -euo pipefail
          python - <<'PY' >> .day38-work/terraform-format.log
          from scripts.iac.module_contracts import GROUPS
          groups = sorted(GROUPS)
          assert groups == ['foundation','governance','ota','roots'], groups
          print('Reviewed module contract groups:', ', '.join(groups))
          PY

      - name: Bind successful command output to stage receipt
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise report \
            --stage day38-terraform-format \
            --proof .day38-work/terraform-format.log \
            --output .day38-reports/terraform-format.json
      - name: Seal independent stage evidence
        run: |
          set -euo pipefail
          python -m scripts.iac.pipeline_evidence publish \
            --stage day38-terraform-format \
            --folder .day38-reports \
            --output .day38-sealed
      - name: Upload stage result, not state or secrets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-terraform-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  terraform_roots:
    name: Day38 static AWS Terraform root (${{ matrix.root }})
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs: [intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        root: [ota-staging, ota-staging-foundation, ota-staging-identity]
    permissions:
      contents: read
    env:
      DAY38_ROOT: ${{ matrix.root }}
    steps:
      - name: Checkout source without storing tokens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install immutable Terraform CLI toolchain
        uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'true'
      - name: Inspect exact AWS root and locked provider
        run: |
          set -euo pipefail
          mkdir -p .day38-work .day38-reports
          python -m scripts.day38_enterprise root --name "$DAY38_ROOT" \
            > .day38-work/root-inventory.json
      - name: Terraform init without backend or AWS credentials
        run: |
          set -euo pipefail
          root="infra/terraform/environments/$DAY38_ROOT"
          terraform -chdir="$root" init -backend=false \
            -lockfile=readonly -input=false -no-color \
            > .day38-work/root-init.log 2>&1
          test -s .day38-work/root-init.log
      - name: Execute native Terraform validate, not a mocked parse
        run: |
          set -euo pipefail
          root="infra/terraform/environments/$DAY38_ROOT"
          terraform -chdir="$root" validate -no-color \
            > .day38-work/root-validate.log 2>&1
          test -s .day38-work/root-validate.log
      - name: Prevent accidental real Plan, Apply or AWS mutation
        run: |
          set -euo pipefail
          echo 'Terraform CLI performed init -backend=false and validate only.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Bind root-specific validation to immutable stage
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise report \
            --stage "day38-root-$DAY38_ROOT" \
            --proof .day38-work/root-validate.log \
            --output .day38-reports/root.json
      - name: Seal independent root proof
        run: |
          set -euo pipefail
          python -m scripts.iac.pipeline_evidence publish \
            --stage "day38-root-$DAY38_ROOT" \
            --folder .day38-reports \
            --output .day38-sealed
      - name: Upload exact-root proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-root-${{ matrix.root }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  terraform_modules:
    name: Day38 Terraform contract group (${{ matrix.group }})
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs: [intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [foundation, ota, governance, roots]
    permissions:
      contents: read
    env:
      DAY38_GROUP: ${{ matrix.group }}
    steps:
      - name: Checkout candidate and all ancestors for trusted diff
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install isolated Terraform contracts toolchain
        uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'true'
      - name: Independently bind baseline reference
        id: baseline
        run: |
          set -euo pipefail
          mkdir -p .day38-work .day38-reports .iac-reports
          python -m scripts.iac.ci_baseline_policy \
            --output .iac-reports/day31-baseline.json
          cp .iac-reports/day31-baseline.json .day38-work/baseline.json
      - name: Checkout exact independent ancestor baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
          persist-credentials: false
      - name: Execute actual reviewed Terraform module contract group
        run: |
          set -euo pipefail
          python -m scripts.iac.gate \
            --baseline baseline \
            --phase contracts \
            --contract-group "$DAY38_GROUP" \
            --report .day38-work/contracts.json
      - name: Verify contract runner returned a nonempty report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('.day38-work/contracts.json'))
          assert d['status']=='passed' and d['phase']=='contracts'
          assert d['contract_runs']>0 and d['contract_files']>0
          PY
      - name: Explain contract scope in human-readable summary
        run: |
          set -euo pipefail
          echo "Terraform group $DAY38_GROUP: native contracts verified." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Bind module test execution proof
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise report \
            --stage "day38-module-$DAY38_GROUP" \
            --proof .day38-work/contracts.json \
            --output .day38-reports/contracts.json
      - name: Seal native contract summary
        run: |
          set -euo pipefail
          python -m scripts.iac.pipeline_evidence publish \
            --stage "day38-module-$DAY38_GROUP" \
            --folder .day38-reports \
            --output .day38-sealed
      - name: Upload group-isolated contract proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-module-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  security:
    name: Day38 Checkov whole-source security gate
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs: [intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate and independent base history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Checkov and HCL2 parser
        uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'true'
      - name: Bind actual ancestor (never select own HEAD as base)
        id: baseline
        run: |
          set -euo pipefail
          mkdir -p .day38-work .day38-reports .iac-reports
          python -m scripts.iac.ci_baseline_policy \
            --output .iac-reports/day31-baseline.json
          cp .iac-reports/day31-baseline.json .day38-work/baseline.json
      - name: Checkout independent ancestor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
          persist-credentials: false
      - name: Run Checkov against deployment source and CI fixture
        run: |
          set -euo pipefail
          python -m scripts.iac.gate \
            --baseline baseline \
            --phase security \
            --report .day38-work/security.json
      - name: Assert both Checkov scan targets were evaluated
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('.day38-work/security.json'))
          assert s == {'status':'passed','phase':'security',
                       'security_scan':'passed','scanned_sources':2}
          PY
      - name: Protect existing three unresolved security blockers
        run: |
          set -euo pipefail
          echo 'No suppression of CKV2_AWS_57 / CKV2_AWS_69.' \
            >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing Checkov scan findings cause this job to FAIL.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Bind successful command output to stage receipt
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise report \
            --stage day38-security \
            --proof .day38-work/security.json \
            --output .day38-reports/security.json
      - name: Seal independent stage evidence
        run: |
          set -euo pipefail
          python -m scripts.iac.pipeline_evidence publish \
            --stage day38-security \
            --folder .day38-reports \
            --output .day38-sealed
      - name: Upload stage result, not state or secrets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  policy_tests:
    name: Day38 Checkov and Terraform policy regressions
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs: [intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout source without granting writer privileges
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install actual IaC and test dependencies
        uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'false'
      # This suite uses source-tree fixtures rather than real cloud credentials.
      # Audits skip policies and static AWS roots.
      # Tests Checkov compensation and unknown resource denial.
      # No deliberate Checkov skip is converted to a pass.
      - name: Execute fixed unit and regression test contract
        run: |
          set -euo pipefail
          mkdir -p .day38-work .day38-reports
          pytest -c scripts/iac/pytest.ini \
            tests/unit/iac/test_scan_policy.py \
            tests/unit/iac/test_day37_aws_static_root.py \
            tests/unit/iac/test_day37_foundation_tls.py \
            tests/unit/iac/test_gate_isolation.py \
            -q --junitxml=.day38-work/policy_tests.xml
      - name: Verify non-empty JUnit evidence for genuine tests
        run: |
          set -euo pipefail
          test -s .day38-work/policy_tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('.day38-work/policy_tests.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) > 0, 'No actual executed tests'
          assert not root.findall('.//failure')
          assert not root.findall('.//error')
          assert not root.findall('.//skipped')
          PY
      - name: Bind successful command output to stage receipt
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise report \
            --stage day38-policy-tests \
            --proof .day38-work/policy_tests.xml \
            --output .day38-reports/policy_tests.json
      - name: Seal independent stage evidence
        run: |
          set -euo pipefail
          python -m scripts.iac.pipeline_evidence publish \
            --stage day38-policy-tests \
            --folder .day38-reports \
            --output .day38-sealed
      - name: Upload stage result, not state or secrets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-policy-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

