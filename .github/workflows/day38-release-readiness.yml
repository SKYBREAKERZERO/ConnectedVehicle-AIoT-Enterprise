          path: .day38-aggregate
      - name: Authenticate aggregate stage manifest
        run: |
          set -euo pipefail
          mkdir -p .day38-verified
          python -m scripts.iac.pipeline_evidence consume \
            --stage day38-aggregate \
            --folder .day38-aggregate \
            --output .day38-verified
      - name: Verify exact 22-stage aggregate source/run/attempt contract
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise verify-aggregate \
            --input .day38-verified/aggregate.json
      - name: Independently derive final release-denial-safe readiness verdict
        id: verdict
        env:
          DAY38_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          mkdir -p .day38-final
          python -m scripts.day38_enterprise gate \
