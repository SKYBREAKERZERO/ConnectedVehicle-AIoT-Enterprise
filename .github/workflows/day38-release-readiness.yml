    name: Day38 adversarial evidence fault-injection probes
    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs: [intake]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout only the checked candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated pytest dependencies, no AWS credentials
        uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'false'
      - name: Execute all explicit negative trust-boundary probes
        run: |
          set -euo pipefail
          mkdir -p .day38-work .day38-reports .day38-probes
          : > .day38-work/fault-probes.log
          for scenario in \
            duplicate-json nonfinite-json zip-traversal zip-symlink \
            zip-duplicate zip-oversize manifest-tamper attempt-replay \
            ruleset-bypass fault-oracle fault-consumer future-run-failure; do
            python -m scripts.day38_probe_evidence run --scenario "$scenario" \
              --output ".day38-probes/probe-$scenario.json" \
              >> .day38-work/fault-probes.log
          done
          test "$(wc -l < .day38-work/fault-probes.log)" -eq 12
          python -m scripts.day38_probe_evidence index \
            --folder .day38-probes --output .day38-probes/probe-index.json
          python -m scripts.day38_probe_evidence verify --folder .day38-probes
      - name: Run independent Python negative tests
        run: |
          set -euo pipefail
          python -m pytest -c scripts/iac/pytest.ini \
            tests/unit/test_day38_readiness.py \
            tests/unit/test_day38_enterprise.py \
            tests/unit/test_day38_probe_evidence.py -q \
            --junitxml=.day38-work/adversarial.xml
      - name: Reject skipped or zero test count
        run: |
          set -euo pipefail
          test -s .day38-work/adversarial.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse('.day38-work/adversarial.xml').getroot()
          assert len(root.findall('.//testcase')) >= 20
          assert not root.findall('.//skipped')
          assert not root.findall('.//failure')
          assert not root.findall('.//error')
          PY

      - name: Bind successful command output to stage receipt
        run: |
          set -euo pipefail
          python -m scripts.day38_enterprise report \
            --stage day38-fault-probes \
            --proof .day38-probes/probe-index.json \
            --output .day38-reports/fault-probes.json
