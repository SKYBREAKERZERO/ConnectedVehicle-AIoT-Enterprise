            --output .day38-final/decision.json
      - name: Upload immutable non-deployment gate decision
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-final/decision.json
          if-no-files-found: warn
          retention-days: 30

  readiness_gate:
    # A green workflow_run is a verified observation, never a PR check result.
    # It must not be added to the required-status list for PR or merge_group.
    name: Day38 upstream readiness gate (not PR-required)
    if: ${{ always() && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    needs: [offline, readiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Require the P0 trusted verifier and disallow PR run as substitute
        env:
          DAY38_OFFLINE: ${{ needs.offline.result }}
          DAY38_READINESS: ${{ needs.readiness.result }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_run|workflow_dispatch|schedule) ;;
            *) exit 1 ;;
          esac
          test "$DAY38_OFFLINE" = skipped
          test "$DAY38_READINESS" = success
          echo 'READY_FOR_STAGING_REVIEW; NOT an AWS deployment authorization.' \
            >> "$GITHUB_STEP_SUMMARY"
          echo 'Day37 separately controls Plan, Apply, ECS and rollback.' \
            >> "$GITHUB_STEP_SUMMARY"


  post_offline_recheck:
    # Read-only handoff. Completion triggers can be missed if all upstream
    # workflows finish early; the scheduled/default-branch observer compensates.
    # Never put actions:write in a PR-editable workflow, even on an if: push job.
    name: Day38 protected-main post-offline read-only handoff (not PR-required)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [offline_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Bind protected-main source and verified offline gate
        env:
          DAY38_GATE: ${{ needs.offline_gate.result }}
        run: |
          set -euo pipefail
          test "$DAY38_GATE" = success
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = SKYBREAKERZERO/ConnectedVehicle-AIoT-Enterprise
          echo 'Offline PASS. Independent upstream observation remains separate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A scheduled or manually dispatched recheck may run after the original run completes.' >> "$GITHUB_STEP_SUMMARY"
      - name: Emit source-bound handoff receipt without any write token
        run: |
          set -euo pipefail
          mkdir -p .day38-handoff
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          identity = {
              'schema_version': 'day38.handoff.v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'candidate_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'decision': 'OFFLINE_COMPLETED_UPSTREAM_RECHECK_PENDING',
              'release_authorized': False,
              'aws_plan_or_apply_executed': False,
          }
          Path('.day38-handoff/receipt.json').write_text(
              json.dumps(identity, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload read-only source handoff evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-handoff/receipt.json
          if-no-files-found: error
          retention-days: 14

  diagnostics:
    # Durable diagnostics are separate from success and never turn a failure green.
    # The gate's result, not this job, determines enterprise acceptance.
    name: Day38 diagnostic summary (never a release authority)
    if: ${{ always() }}
    needs: [offline, readiness, offline_gate, readiness_gate, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Print distinct offline and trusted-observer outcomes
        env:
          DAY38_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          data=json.loads(os.environ['DAY38_RESULTS'])
          print('Day38 execution results (never approval):')
          for key, row in sorted(data.items()):
              print(f'{key} = {row.get("result", "missing")}')
          if os.environ.get('GITHUB_EVENT_NAME') in {'workflow_run', 'workflow_dispatch', 'schedule'}:
              assert data['offline_gate']['result']=='skipped'
          else:
              assert data['readiness_gate']['result']=='skipped'
          PY
      - name: State explicit cloud and production non-authority
        run: |
          set -euo pipefail
          echo '## Day38 diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo 'Readiness observation is not Terraform Plan or Apply.' \
            >> "$GITHUB_STEP_SUMMARY"
          echo 'No AWS credentials or mutable cloud state touched.' \
            >> "$GITHUB_STEP_SUMMARY"
