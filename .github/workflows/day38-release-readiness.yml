        run: |
          set -euo pipefail
          python -m scripts.iac.pipeline_evidence needs \
            --expected intake,source_guard,dependencies,python_quality,terraform_format,terraform_roots,terraform_modules,security,policy_tests,trust_tests,recovery_tests,day37_tests,database_tests,ota_tests,fault_probes,workflow_contracts,supply_tests,state_tests,offline,evidence
      - name: Download matching same-attempt verified aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
