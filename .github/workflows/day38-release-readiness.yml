  readiness:
    # This is a read-only observer, not a PR-required status and not AWS release.
    # workflow_run uses github.sha (default-branch verifier), NOT triggering SHA.
    name: Day38 trusted upstream observation (not PR gate)
    if: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout immutable default-branch revision of verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install interpreter only, never PR dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bounded wait for the originating protected-main offline run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .day38-reports
          python -m scripts.day38_readiness await-offline \
            --output .day38-reports/day38-origin.json
      - name: Explain untrusted upstream identity and token boundary
        run: |
          set -euo pipefail
          echo 'Read-only observation; no PR checkout, no AWS OIDC.' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact latest workflow attempts and immutable artifacts
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .day38-reports
          python -m scripts.day38_readiness evaluate \
            --output .day38-reports/day38-readiness.json
      - name: Preserve READY or BLOCKED audit record
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-reports/day38-readiness.json
          if-no-files-found: error
          retention-days: 30

  offline_gate:
    # Only this stable named context may be configured as a PR-required check.
    # It must fail on any mandatory job failure or missing aggregate artifact.
    name: Day38 offline audit gate (not AWS release)
    if: ${{ always() && github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    needs:

      - intake

      - source_guard

      - dependencies

      - python_quality

      - terraform_format

      - terraform_roots

      - terraform_modules

      - security

      - policy_tests

      - trust_tests

      - recovery_tests

      - day37_tests

      - database_tests

      - ota_tests

      - fault_probes

      - workflow_contracts

      - supply_tests

      - state_tests

      - offline

      - evidence

    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact event candidate for final gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install independent Python gate
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
