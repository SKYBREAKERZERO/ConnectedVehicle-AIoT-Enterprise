    if: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install dedicated IaC toolchain (pinned)
        uses: ./.github/actions/setup-ci-iac
        with:
          terraform: 'true'
      - name: Bind event candidate and independent ancestor baseline
        id: baseline
        run: |
          set -euo pipefail
          mkdir -p .day38-reports .iac-reports
          python -m scripts.iac.ci_baseline_policy --output .iac-reports/day31-baseline.json
          cp .iac-reports/day31-baseline.json .day38-reports/baseline.json
      - name: Checkout independent baseline without writable token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
          persist-credentials: false
      - name: Validate all Terraform formatting and each AWS-only root
        id: terraform
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          for root in ota-staging ota-staging-foundation ota-staging-identity; do
            base="infra/terraform/environments/$root"
            terraform -chdir="$base" init -backend=false \
              -lockfile=readonly -input=false -no-color
            terraform -chdir="$base" validate -no-color
          done
      - name: Run pinned offline IaC security gate (no waiver bypass)
        id: security
        run: |
          set -euo pipefail
          python -m scripts.iac.gate --baseline baseline \
            --phase security --report .day38-reports/security.json
      - name: Regress trust, Checkov and Day38 fail-closed rules
        id: regression
        run: |
          set -euo pipefail
          pytest -c scripts/iac/pytest.ini \
            tests/unit/iac/test_scan_policy.py \
            tests/unit/iac/test_day37_aws_static_root.py \
            tests/unit/iac/test_day37_foundation_tls.py \
            tests/unit/iac/test_pipeline_evidence.py \
            tests/unit/test_day38_readiness.py \
            tests/unit/test_day38_enterprise.py -q
      - name: Emit audit receipt even for failures
        if: ${{ always() }}
        env:
          DAY38_BASELINE: ${{ steps.baseline.outcome }}
          DAY38_TERRAFORM: ${{ steps.terraform.outcome }}
          DAY38_SECURITY: ${{ steps.security.outcome }}
          DAY38_REGRESSION: ${{ steps.regression.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .day38-reports
          python -m scripts.day38_readiness audit \
            --output .day38-reports/day38-audit.json
      - name: Upload untrusted read-only audit diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day38-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day38-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

