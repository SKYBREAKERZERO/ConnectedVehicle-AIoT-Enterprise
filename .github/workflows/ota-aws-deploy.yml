name: OTA AWS deployment governance (dry run only)

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact protected main commit whose Runtime and IaC checks succeeded
        required: true
        type: string
      mode:
        description: Day27 admission and recovery remain dry run only, without AWS credentials or Apply
        required: true
        default: dry-run
        type: choice
        options: [dry-run]

permissions:
  contents: read
  actions: read

concurrency:
  group: ota-production-governance
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m scripts.iac.deploy_governance --preflight --commit "$TARGET_SHA" --mode "$MODE"
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.release_commit }}
          MODE: ${{ inputs.mode }}
  dry_run:
    needs: preflight
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m scripts.iac.deploy_governance --preflight --commit "$TARGET_SHA" --mode "$MODE"
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.release_commit }}
          MODE: ${{ inputs.mode }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day25-protected-dry-run
          path: .iac-reports/day25-dry-run.json
          include-hidden-files: true
          if-no-files-found: error
