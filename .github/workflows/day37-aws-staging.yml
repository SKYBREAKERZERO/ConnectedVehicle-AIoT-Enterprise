        path: .day37/recovery/recovery.json
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 14

  gate:
    name: '10 Final evidence decision (deploy requires zero-drift closure)'
    if: ${{ always() }}
    needs:
    - source
    - admission
    - publish
    - plan
    - bootstrap
    - deploy_plan
    - deploy
    - verify
    - close
