        \ .day37/closure/zero-drift.json\npython -m scripts.day37_reconcile --phase deploy --fence .day37/fence/fence.json --terraform-json .day37/closure/zero-drift.json\
        \ --terraform-exit-code \"$CODE\" --release .day37/publish/release.json --output .day37/closure/proof.json\npython -m scripts.day37_release_guard\
        \ closure --receipt .day37/fence/fence.json --proof .day37/closure/proof.json --sha256 \"$DAY37_APPROVED_PLAN_SHA\" --release .day37/publish/release.json\n\
        python -m scripts.day37_fence close --receipt .day37/fence/fence.json --proof .day37/closure/proof.json --output .day37/closure/fence-closed.json\n\
        python - <<'PYCODE'\nimport json, os\nfrom pathlib import Path\nrecord = {'decision':'STAGING_TERRAFORM_ZERO_DRIFT_AND_FENCE_CLOSED',\
        \ 'commit':os.environ['GITHUB_SHA'],\n          'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],\n\
        \          'registry_digest':os.environ['TF_VAR_image_digest'], 'production_authorized':False,'release_authorized':False}\nPath('.day37/closure/closed.json').write_text(json.dumps(record,\
        \ indent=2)+'\\n')\nPYCODE\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day37-closure-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.day37/closure/closed.json

          .day37/closure/proof.json

          .day37/closure/fence-closed.json'
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14
  recovery:
    name: 09 Emergency rollback; durable reconciliation fence remains ACTIVE
    needs:
    - source
    - admission
    - publish
    - deploy_plan
    - deploy
    - verify
    if: ${{ always() && inputs.mode == 'deploy' && (needs.deploy.result == 'failure' || needs.verify.result == 'failure') && needs.publish.result
      == 'success' && needs.admission.result == 'success' }}
    environment: aws-staging-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DAY37_ROLE_ARN: ${{ vars.DAY37_RECOVERY_ROLE_ARN }}
      DAY37_ACCOUNT_ID: ${{ vars.DAY37_ACCOUNT_ID }}
      DAY37_CLUSTER: ${{ vars.DAY37_CLUSTER }}
      DAY37_SERVICE: ${{ vars.DAY37_SERVICE }}
      DAY37_PLAN_BUCKET: ${{ vars.DAY37_PLAN_BUCKET }}
      DAY37_PLAN_PREFIX: ${{ vars.DAY37_PLAN_PREFIX }}
      DAY37_PLAN_KMS_ARN: ${{ vars.DAY37_PLAN_KMS_ARN }}
      DAY37_BACKEND_KMS_ARN: ${{ vars.DAY37_BACKEND_KMS_ARN }}
      DAY37_ECR_REPOSITORY: ${{ vars.DAY37_ECR_REPOSITORY }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: ./.github/actions/setup-ci-runtime
    - name: BLOCKED on missing/malformed reviewed recovery environment configuration
      run: python -m scripts.day37_preflight config --mode recovery
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-region: ap-northeast-1
        role-to-assume: ${{ env.DAY37_ROLE_ARN }}
        role-session-name: day37-recover-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: 900
    - name: Verify STS role, AWS account and actual Staging prerequisites (recovery)
      run: python -m scripts.day37_preflight live --mode recovery
    - name: Read LIVE S3 Fence, never trust optional Artifact as lock authority
      id: live_fence
      run: 'set -euo pipefail

        umask 077

        mkdir -p .day37/recovery/fence

        python -m scripts.day37_fence probe --fence-output .day37/recovery/fence/fence.json --status-output .day37/recovery/fence-status.json

        echo "active=$(python -c ''import json;print(json.load(open(".day37/recovery/fence-status.json"))["active"])'')" >> "$GITHUB_OUTPUT"'
    - name: Determine if authenticated pre-Apply checkpoint exists
      id: checkpoint
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p .day37/recovery

        python -m scripts.day37_release_guard checkpoint --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
        --output .day37/recovery/checkpoint-status.json

        RESULT=$(python -c "import json;print(json.load(open(''.day37/recovery/checkpoint-status.json''))[''checkpoint_exists''])")

        echo "exists=$RESULT" >> "$GITHUB_OUTPUT"

        '
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ steps.checkpoint.outputs.exists == 'true' }}
      with:
        name: day37-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/recovery
    - name: Record missing/unsafe checkpoint or missing ACTIVE fence without rollback
      if: ${{ steps.checkpoint.outputs.exists != 'true' || steps.live_fence.outputs.active != 'true' }}
      run: 'python -m scripts.day37_release_guard skipped-recovery --output .day37/recovery/recovery.json

        '
    - name: Revert ECS only after checkpoint and durable fence are verified
      if: ${{ steps.checkpoint.outputs.exists == 'true' && steps.live_fence.outputs.active == 'true' }}
      run: "set -euo pipefail\npython -m scripts.day37_fence recovery-check --checkpoint .day37/recovery/checkpoint.json --fence .day37/recovery/fence/fence.json\n\
        python -m scripts.day37_release_guard recovery-admission --checkpoint .day37/recovery/checkpoint.json --fence .day37/recovery/fence/fence.json\n\
        python -m scripts.day37_recovery_guard --checkpoint .day37/recovery/checkpoint.json --fence .day37/recovery/fence/fence.json --output\
        \ .day37/recovery/restore-admission.json\nRESTORE=$(python -c 'import json;print(str(json.load(open(\".day37/recovery/restore-admission.json\"\
        ))[\"restore_required\"]).lower())')\nif [[ \"$RESTORE\" == 'true' ]]; then\n  python -m scripts.day37_aws recover --checkpoint .day37/recovery/checkpoint.json\
        \ --output .day37/recovery/recovery.json\nelse\n  python -m scripts.day37_release_guard skipped-recovery --output .day37/recovery/recovery.json\n\
        fi\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: day37-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/recovery/recovery.json
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 14
  gate:
    name: 10 Final evidence decision (deploy requires zero-drift closure)
    if: ${{ always() }}
    needs:
    - source
    - admission
    - publish
    - plan
    - bootstrap
    - bootstrap_close
    - deploy_plan
    - deploy
    - verify
    - close
    - recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ needs.admission.result == 'success' }}
      with:
        name: day37-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/admission
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ (inputs.mode == 'plan' || inputs.mode == 'bootstrap') && needs.plan.result == 'success' }}
      with:
        name: day37-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.mode == 'bootstrap' && needs.bootstrap.result == 'success' }}
      with:
        name: day37-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/bootstrap
    - if: ${{ inputs.mode == 'bootstrap' && needs.bootstrap_close.result == 'success' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-bootstrap-closure-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/bootstrap
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.mode == 'deploy' && needs.publish.result == 'success' }}
      with:
        name: day37-publish-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/publish
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.mode == 'deploy' && needs.deploy.result == 'success' }}
      with:
        name: day37-deployment-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/deploy
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.mode == 'deploy' && needs.verify.result == 'success' }}
      with:
        name: day37-verified-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/verify
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-deploy-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/deploy-plan
      if: ${{ inputs.mode == 'deploy' && needs.deploy_plan.result == 'success' }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-closure-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/close
      if: ${{ inputs.mode == 'deploy' && needs.close.result == 'success' }}
    - name: Emit evidence-bound READY/BLOCKED with production authority always false
      if: ${{ always() }}
      env:
        PIPELINE_NEEDS: ${{ toJSON(needs) }}
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        umask 077

        mkdir -p .day37

        python -m scripts.day37_enterprise_gate --mode "${DAY37_MODE}" --folder .day37/check --output .day37/final.json'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: day37-final-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/final.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
  bootstrap_close:
    name: 03c Independent Bootstrap AWS/State reconcile and S3 CAS closure
    needs:
    - source
    - admission
    - plan
    - bootstrap
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' && needs.bootstrap.result == 'success' }}
    environment: aws-staging-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DAY37_ROLE_ARN: ${{ vars.DAY37_RECOVERY_ROLE_ARN }}
      DAY37_ACCOUNT_ID: ${{ vars.DAY37_ACCOUNT_ID }}
      DAY37_BACKEND_BUCKET: ${{ vars.DAY37_BACKEND_BUCKET }}
      DAY37_BACKEND_KEY: ${{ vars.DAY37_BACKEND_KEY }}
      DAY37_BACKEND_KMS_ARN: ${{ vars.DAY37_BACKEND_KMS_ARN }}
      TF_VAR_aws_account_id: ${{ vars.DAY37_ACCOUNT_ID }}
      TF_VAR_aws_region: ap-northeast-1
      TF_VAR_vpc_id: ${{ vars.DAY37_VPC_ID }}
      TF_VAR_private_subnet_ids: ${{ vars.DAY37_PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_alb_security_group_id: ${{ vars.DAY37_ALB_SG_ID }}
      TF_VAR_database_security_group_id: ${{ vars.DAY37_DATABASE_SG_ID }}
      TF_VAR_redis_security_group_id: ${{ vars.DAY37_REDIS_SG_ID }}
      TF_VAR_alb_target_group_arn: ${{ vars.DAY37_TARGET_GROUP_ARN }}
      TF_VAR_application_database_secret_arn: ${{ vars.DAY37_APP_DB_SECRET_ARN }}
      TF_VAR_tenant_id: ${{ vars.DAY37_TENANT_ID }}
      TF_VAR_oidc_issuer: ${{ vars.DAY37_APP_OIDC_ISSUER }}
      TF_VAR_oidc_jwks_url: ${{ vars.DAY37_APP_OIDC_JWKS_URL }}
      TF_VAR_oidc_audience: ${{ vars.DAY37_APP_OIDC_AUDIENCE }}
      TF_VAR_redis_host: ${{ vars.DAY37_REDIS_HOST }}
      TF_VAR_redis_auth_secret_arn: ${{ vars.DAY37_REDIS_AUTH_SECRET_ARN }}
      DAY37_ECR_REPOSITORY: ${{ vars.DAY37_ECR_REPOSITORY }}
      DAY37_CLUSTER: ${{ vars.DAY37_CLUSTER }}
      DAY37_SERVICE: ${{ vars.DAY37_SERVICE }}
      DAY37_ALB_TARGET_GROUP_ARN: ${{ vars.DAY37_TARGET_GROUP_ARN }}
      DAY37_PLAN_BUCKET: ${{ vars.DAY37_PLAN_BUCKET }}
      DAY37_PLAN_PREFIX: ${{ vars.DAY37_PLAN_PREFIX }}
      DAY37_PLAN_KMS_ARN: ${{ vars.DAY37_PLAN_KMS_ARN }}
      DAY37_APPROVED_PLAN_SHA: ${{ needs.plan.outputs.plan_sha256 }}
      TF_VAR_enable_service: 'false'
      TF_VAR_desired_count: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: ./.github/actions/setup-ci-runtime
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      with:
        terraform_version: 1.14.7
        terraform_wrapper: false
    - name: Validate independent recovery account and IAM role
      run: python -m scripts.day37_preflight config --mode recovery
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-region: ap-northeast-1
        role-to-assume: ${{ env.DAY37_ROLE_ARN }}
        role-session-name: day37-bootstrap-close-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: 1800
    - name: Verify Recovery Role and Staging prerequisites
      run: python -m scripts.day37_preflight live --mode recovery
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/bootstrap
    - name: Independent Bootstrap Zero Drift, AWS Recheck and Fence CAS
      run: 'set -euo pipefail

        umask 077

        mkdir -p .day37/bootstrap-close

        bash scripts/day37_tf.sh init

        # A real S3 CAS readback is enforced inside the close command.

        export TF_VAR_enable_service=false TF_VAR_desired_count=0

        set +e

        terraform -chdir="${DAY37_TF_ROOT}" plan -detailed-exitcode -input=false -lock-timeout=30s -no-color -out="${PWD}/.day37/bootstrap-close/no-drift.tfplan"
        > .day37/bootstrap-close/terraform-private.log 2>&1

        RC=$?

        set -e

        [[ "$RC" -eq 0 ]] || { echo ''BLOCKED: Bootstrap still has Terraform drift'' >&2; exit 1; }

        terraform -chdir="${DAY37_TF_ROOT}" show -json "${PWD}/.day37/bootstrap-close/no-drift.tfplan" > .day37/bootstrap-close/no-drift.json

        python -m scripts.day37_reconcile --phase bootstrap --fence .day37/bootstrap/fence.json --terraform-json .day37/bootstrap-close/no-drift.json
        --terraform-exit-code "$RC" --output .day37/bootstrap-close/proof.json

        python -m scripts.day37_fence close --receipt .day37/bootstrap/fence.json --proof .day37/bootstrap-close/proof.json --output .day37/bootstrap-close/closed-fence.json

        '
    - if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day37-bootstrap-closure-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.day37/bootstrap-close/proof.json

          .day37/bootstrap-close/closed-fence.json'
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 30
