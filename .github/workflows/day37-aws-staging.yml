        path: .day37/deploy/deployment.json
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

  verify:
    name: '07 Independent ECR + every actual RUNNING ECS Task imageDigest + ALB'
    needs:
    - source
    - admission
    - publish
    - deploy_plan
    - deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' }}
    environment: aws-staging-verify
