      DAY37_CLUSTER: ${{ vars.DAY37_CLUSTER }}
      DAY37_SERVICE: ${{ vars.DAY37_SERVICE }}
      DAY37_ALB_TARGET_GROUP_ARN: ${{ vars.DAY37_TARGET_GROUP_ARN }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
      with:
        cosign-release: 'v2.6.0'
    - name: BLOCKED on missing/malformed reviewed verify environment configuration
      run: python -m scripts.day37_preflight config --mode verify
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-region: ap-northeast-1
        role-to-assume: ${{ env.DAY37_ROLE_ARN }}
        role-session-name: day37-verify-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: 900
    - name: Verify STS role, AWS account and actual Staging prerequisites (verify)
      run: python -m scripts.day37_preflight live --mode verify
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-publish-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/publish
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-deployment-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/deploy
    - name: Recheck signature, Registry Digest and actual deployed ECS service
      run: |
        set -euo pipefail
        bash scripts/day37_tf.sh verify-release .day37/publish/release.json
        URI=$(python -c "import json;print(json.load(open('.day37/publish/release.json'))['image_uri'])")
        python -m scripts.day37_aws verify --image-uri "$URI" --desired 2 --output .day37/verify/verified.json
        python - <<'PY'
        import json
        from pathlib import Path
        a=json.loads(Path('.day37/deploy/deployment.json').read_text())
        b=json.loads(Path('.day37/verify/verified.json').read_text())
        if a['image_uri']!=b['image_uri'] or a['task_definition']!=b['task_definition']:
            raise SystemExit('ECS deployment drift after Apply')
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day37-verified-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/verify/verified.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14

  close:
    name: 08 Independent zero-drift Terraform reconciliation and fence closure
    needs:
    - source
    - admission
    - publish
    - deploy_plan
    - deploy
    - verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' && needs.verify.result == 'success' }}
    environment: aws-staging-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DAY37_ROLE_ARN: ${{ vars.DAY37_RECOVERY_ROLE_ARN }}
      DAY37_ACCOUNT_ID: ${{ vars.DAY37_ACCOUNT_ID }}
      DAY37_BACKEND_BUCKET: ${{ vars.DAY37_BACKEND_BUCKET }}
      DAY37_BACKEND_KEY: ${{ vars.DAY37_BACKEND_KEY }}
      DAY37_BACKEND_KMS_ARN: ${{ vars.DAY37_BACKEND_KMS_ARN }}
      TF_VAR_aws_account_id: ${{ vars.DAY37_ACCOUNT_ID }}
      TF_VAR_aws_region: ap-northeast-1
      TF_VAR_data_kms_key_arn: ${{ vars.DAY37_DATA_KMS_ARN }}
      TF_VAR_vpc_id: ${{ vars.DAY37_VPC_ID }}
      TF_VAR_private_subnet_ids: ${{ vars.DAY37_PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_alb_security_group_id: ${{ vars.DAY37_ALB_SG_ID }}
      TF_VAR_database_security_group_id: ${{ vars.DAY37_DATABASE_SG_ID }}
      TF_VAR_redis_security_group_id: ${{ vars.DAY37_REDIS_SG_ID }}
      TF_VAR_alb_target_group_arn: ${{ vars.DAY37_TARGET_GROUP_ARN }}
      TF_VAR_application_database_secret_arn: ${{ vars.DAY37_APP_DB_SECRET_ARN }}
      TF_VAR_tenant_id: ${{ vars.DAY37_TENANT_ID }}
      TF_VAR_oidc_issuer: ${{ vars.DAY37_APP_OIDC_ISSUER }}
      TF_VAR_oidc_jwks_url: ${{ vars.DAY37_APP_OIDC_JWKS_URL }}
      TF_VAR_oidc_audience: ${{ vars.DAY37_APP_OIDC_AUDIENCE }}
      TF_VAR_redis_host: ${{ vars.DAY37_REDIS_HOST }}
      TF_VAR_redis_auth_secret_arn: ${{ vars.DAY37_REDIS_AUTH_SECRET_ARN }}
      DAY37_ECR_REPOSITORY: ${{ vars.DAY37_ECR_REPOSITORY }}
      DAY37_CLUSTER: ${{ vars.DAY37_CLUSTER }}
      DAY37_SERVICE: ${{ vars.DAY37_SERVICE }}
      DAY37_ALB_TARGET_GROUP_ARN: ${{ vars.DAY37_TARGET_GROUP_ARN }}
      DAY37_PLAN_BUCKET: ${{ vars.DAY37_PLAN_BUCKET }}
      DAY37_PLAN_PREFIX: ${{ vars.DAY37_PLAN_PREFIX }}
      DAY37_PLAN_KMS_ARN: ${{ vars.DAY37_PLAN_KMS_ARN }}
      DAY37_APPROVED_PLAN_SHA: ${{ needs.deploy_plan.outputs.plan_sha256 }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      with:
        terraform_version: 1.14.7
        terraform_wrapper: false
    - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
      with:
        cosign-release: v2.6.0
    - name: Verify recovery Role configuration
      run: |
        python -m scripts.day37_preflight config --mode recovery
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-region: ap-northeast-1
        role-to-assume: ${{ env.DAY37_ROLE_ARN }}
        role-session-name: day37-close-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: 1800
    - name: Confirm independent ECS Staging identity
      run: |
        python -m scripts.day37_preflight live --mode recovery
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-publish-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/publish
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-fence-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/fence
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-verified-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/verified
    - name: Require real ECS Digest and ZERO changes in Terraform configuration/state
      run: |
        set -euo pipefail
        bash scripts/day37_tf.sh init
        bash scripts/day37_tf.sh verify-release .day37/publish/release.json
        URI=$(python -c "import json;print(json.load(open('.day37/publish/release.json'))['image_uri'])")
        mkdir -p .day37/closure
        python -m scripts.day37_aws verify --image-uri "$URI" --desired 2 --output .day37/closure/real-tasks.json
        python - <<'PYCODE'
        import json
        from pathlib import Path
        prior = json.loads(Path('.day37/verified/verified.json').read_text())
        current = json.loads(Path('.day37/closure/real-tasks.json').read_text())
        if prior['image_uri'] != current['image_uri'] or prior['task_definition'] != current['task_definition']:
            raise SystemExit('BLOCKED: deployment changed after independent verification')
        PYCODE
        export TF_VAR_enable_service=true TF_VAR_desired_count=2
        export TF_VAR_image_digest="${URI##*@}"
        set +e
        terraform -chdir="${DAY37_TF_ROOT}" plan -detailed-exitcode -input=false -lock-timeout=30s -no-color -out="${PWD}/.day37/closure/zero-drift.tfplan" > .day37/closure/terraform.log 2>&1
        CODE=$?
        set -e
        if [[ "$CODE" -ne 0 ]]; then
          echo 'BLOCKED: zero-drift reconciliation requires Terraform plan exit 0'
          exit 1
        fi
        python -m scripts.day37_plan_transport close-fence --receipt .day37/fence/fence.json --verified
        python - <<'PYCODE'
        import json, os
        from pathlib import Path
        record = {'decision':'STAGING_TERRAFORM_ZERO_DRIFT_AND_FENCE_CLOSED', 'commit':os.environ['GITHUB_SHA'],
                  'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'registry_digest':os.environ['TF_VAR_image_digest'], 'production_authorized':False,'release_authorized':False}
        Path('.day37/closure/closed.json').write_text(json.dumps(record, indent=2)+'\\n')
        PYCODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day37-closure-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/closure/closed.json
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14
  recovery:
    name: '09 Emergency rollback; durable reconciliation fence remains ACTIVE'
    needs:
    - source
    - admission
    - publish
    - deploy_plan
    - deploy
    - verify
    if: ${{ always() && inputs.mode == 'deploy' && (needs.deploy.result == 'failure' || needs.verify.result == 'failure') && needs.publish.result
      == 'success' && needs.admission.result == 'success' }}
    environment: aws-staging-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
