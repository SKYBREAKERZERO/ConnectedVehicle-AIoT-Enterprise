    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      with:
        terraform_version: '1.14.7'
        terraform_wrapper: false
    - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
      with:
        cosign-release: 'v2.6.0'
    - name: BLOCKED on missing/malformed reviewed deploy environment configuration
      run: python -m scripts.day37_preflight config --mode deploy
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-region: ap-northeast-1
        role-to-assume: ${{ env.DAY37_ROLE_ARN }}
        role-session-name: day37-deploy-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: 1800
    - name: Verify STS role, AWS account and actual Staging prerequisites (deploy)
      run: python -m scripts.day37_preflight live --mode deploy
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-publish-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/publish
    - name: Capture healthy previous Task Definition before any mutable action
      run: |
        set -euo pipefail
        python -m scripts.day37_aws checkpoint --output .day37/deploy/checkpoint.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day37-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/deploy/checkpoint.json
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: day37-deploy-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/reviewed-plan
    - name: Verify reviewed S3 Plan hash, mark reconciliation fence, Apply without replanning
      run: |
        set -euo pipefail
        bash scripts/day37_tf.sh init
        mkdir -p .day37/private .day37/deploy
        python -m scripts.day37_plan_transport clear-check
        python -m scripts.day37_plan_transport fetch --phase deploy --receipt .day37/reviewed-plan/receipt.json --summary .day37/reviewed-plan/plan-summary.json --sha256 "$DAY37_APPROVED_PLAN_SHA" --output .day37/private/deploy.tfplan
        bash scripts/day37_tf.sh verify-release .day37/publish/release.json
        python -m scripts.day37_plan_transport mark-fence --phase deploy --receipt .day37/reviewed-plan/receipt.json --output .day37/deploy/fence.json
        # Once marked, failure/cancel/crash leaves durable S3 fence. No next release until reconciled.
        terraform -chdir="${DAY37_TF_ROOT}" apply -input=false -lock-timeout=30s -no-color "${PWD}/.day37/private/deploy.tfplan"
        aws ecs wait services-stable --cluster "$DAY37_CLUSTER" --services "$DAY37_SERVICE" --region ap-northeast-1
        URI=$(python -c "import json;print(json.load(open('.day37/publish/release.json'))['image_uri'])")
        python -m scripts.day37_aws verify --image-uri "$URI" --desired 2 --output .day37/deploy/verified.json
        python - <<'PYCODE'
        import json
        from pathlib import Path
        x = json.loads(Path('.day37/deploy/verified.json').read_text())
        r = json.loads(Path('.day37/publish/release.json').read_text())
        x['decision'] = 'ECS_DEPLOYMENT_ACCEPTED'
        x['registry_digest'] = r['registry_digest']
        Path('.day37/deploy/deployment.json').write_text(json.dumps(x,indent=2)+'\\n')
        PYCODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
