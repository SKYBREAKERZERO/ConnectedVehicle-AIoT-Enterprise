        role-to-assume: ${{ env.DAY37_ROLE_ARN }}
        role-session-name: day37-recover-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: 900
    - name: Verify STS role, AWS account and actual Staging prerequisites (recovery)
      run: python -m scripts.day37_preflight live --mode recovery
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
