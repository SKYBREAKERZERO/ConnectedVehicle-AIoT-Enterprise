    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: BLOCKED on missing/malformed reviewed recovery environment configuration
      run: python -m scripts.day37_preflight config --mode recovery
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
