        path: .day37/check/admission
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ (inputs.mode == 'plan' || inputs.mode == 'bootstrap') && needs.plan.result == 'success' }}
      with:
        name: day37-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/plan
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.mode == 'bootstrap' && needs.bootstrap.result == 'success' }}
      with:
        name: day37-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day37/check/bootstrap
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.mode == 'deploy' && needs.publish.result == 'success' }}
