name: Day42 Enterprise OTA Release Acceptance
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: day42-enterprise-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Runtime security and infrastructure
    uses: ./.github/workflows/day40-runtime-security.yml
  recovery:
    name: Rotation, release admission and PostgreSQL recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-runtime
      - name: Exercise all recovery and release controls
        run: |
          set -euo pipefail
          python -m pytest -q tests/unit/test_day41_rotation.py --junitxml=.reports/rotation.xml
          python -m pytest -q tests/unit/test_day41_admission.py --junitxml=.reports/admission.xml
          python -m pytest -q tests/unit/test_day42_rollout.py tests/integration/day21/test_day42_recovery.py --junitxml=.reports/rollout.xml
          python -m scripts.iac.pipeline_evidence publish --stage day42-recovery --folder .reports --output .sealed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day42-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sealed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  acceptance:
    name: Day42 Enterprise Final Gate
    needs: [runtime, recovery]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every chain to succeed
        env:
          RUNTIME: ${{ needs.runtime.result }}
          RECOVERY: ${{ needs.recovery.result }}
        run: test "$RUNTIME" = success && test "$RECOVERY" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '{day40-decision,day40-proof-aggregate,day42-recovery}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: .day42
      - name: Recompute evidence and record the release boundary
        run: python3 -m scripts.day42_enterprise_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day42-enterprise-${{ github.run_id }}-${{ github.run_attempt }}
          path: day42-enterprise.json
          retention-days: 14
          if-no-files-found: error
