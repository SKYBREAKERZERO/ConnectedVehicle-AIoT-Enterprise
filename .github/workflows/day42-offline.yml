name: Day42 OTA Canary and Recovery Acceptance
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: day42-offline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: 01 Python quality and typing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-runtime
      - run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy .
  rollout:
    name: 02 Canary, circuit breaker and recovery faults
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-runtime
      - run: |
          python -m pytest -q tests/unit/test_day42_rollout.py tests/integration/day21/test_day42_recovery.py --junitxml=.day42/rollout.xml
          python -m scripts.iac.pipeline_evidence publish --stage day42-rollout --folder .day42 --output .sealed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day42-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sealed
          include-hidden-files: true
          if-no-files-found: error
  gate:
    name: 03 Independent runner evidence gate
    needs: [quality, rollout]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - env:
          PIPELINE_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m scripts.iac.pipeline_evidence needs --expected quality,rollout
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: day42-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: .day42-input
      - run: python3 -m scripts.day42_evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day42-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: day42-acceptance.json
          if-no-files-found: error
