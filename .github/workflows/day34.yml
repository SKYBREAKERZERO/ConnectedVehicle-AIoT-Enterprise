name: Day34 full OTA acceptance
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  # Distinct from the called Runtime group, including for the same PR.
  group: day34-entry-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Complete Day34 verification chain
    # Same-commit reusable workflow: baseline -> lint/types/contracts -> real
    # Runtime -> PostgreSQL/observability faults -> Day34 evidence -> Runtime gate.
    uses: ./.github/workflows/runtime.yml
  day34:
    name: Day34 full acceptance gate
    needs: [acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DAY16_EVIDENCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Require the complete verification chain to succeed
      env:
        PIPELINE_NEEDS: ${{ toJSON(needs) }}
      run: python3 -m scripts.iac.pipeline_evidence needs --expected acceptance
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: runtime-verified-evidence
        path: .day34-input
    - name: Verify exact candidate, run, attempt and every evidence hash
      run: python3 -m scripts.iac.pipeline_evidence verify --stage runtime-evidence --folder .day34-input
    - name: Confirm Day34 acceptance and closed release authorization
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        root = Path('.day34-input')
        proof = json.loads((root / 'day34-acceptance.json').read_text())
        baseline = json.loads((root / 'day31-runtime-baseline.json').read_text())
        if not (
            proof['decision'] == 'READY_FOR_LOCAL_REVIEW'
            and proof['ci_verified'] is True
            and proof['release_authorized'] is False
            and proof['real_aws_verified'] is False
            and proof['physical_boot_verified'] is False
            and proof['simulated_installation'] is True
            and proof['provenance']['commit'] == os.environ['GITHUB_SHA']
            and baseline['candidate_sha'] == os.environ['GITHUB_SHA']
            and proof['provenance']['run_id'] == os.environ['DAY16_EVIDENCE_RUN_ID']
        ):
            raise SystemExit('BLOCKED: Day34 acceptance/source/run/release policy mismatch')
        result = {
            'decision': proof['decision'],
            'ci_verified': True,
            'release_authorized': False,
            'tested_commit': baseline['candidate_sha'],
            'pr_head_sha': baseline['pr_head_sha'],
            'run_id': proof['provenance']['run_id'],
            'proofs': proof['proofs'],
        }
        Path('day34-workflow-result.json').write_text(json.dumps(result, indent=2) + '\n')
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
            out.write('## Day34 full OTA acceptance\n\n')
            out.write('All mandatory stages passed. Release authorized: **false**.\n\n')
            out.write('Tested commit: `' + result['tested_commit'] + '`\n')
        PY
    - name: Upload final Day34 workflow result
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day34-workflow-result
        path: day34-workflow-result.json
        if-no-files-found: error
        retention-days: 7
