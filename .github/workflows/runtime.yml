name: Runtime quality gates
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  merge_group: null
  workflow_dispatch: null
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: 01 Baseline and candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python3 -m scripts.iac.ci_baseline_policy --output .runtime-reports/day31-runtime-baseline.json
      name: Verify event-bound baseline
    - run: python -m scripts.iac.pipeline_evidence publish --stage runtime-baseline --folder .runtime-reports --output
        .ci-bundles/runtime-baseline
      name: Seal runtime-baseline candidate / attempt / hashes
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: runtime-baseline-source
        path: .ci-bundles/runtime-baseline
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  lint:
    name: 02 Ruff lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/setup-ci-runtime
    - run: |-
        ruff check .
        ruff format --check .
    needs:
    - baseline
  types:
    name: 03 Types and module rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/setup-ci-runtime
    - run: |-
        mypy .
        python -m scripts.day17_rules
    needs:
    - baseline
  contracts:
    name: 04 Schema and API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/setup-ci-runtime
    - run: |-
        set -euo pipefail
        python -m scripts.iac.ci_baseline_policy --output .runtime-reports/day31-runtime-baseline.json
        base=$(python -c 'import json; print(json.load(open(".runtime-reports/day31-runtime-baseline.json"))["baseline_sha"])')
        baseline=$(mktemp -d)
        git archive "$base" | tar -x -C "$baseline"
        python -m scripts.contracts --baseline "$baseline"
        python -m scripts.contracts --require-day17 --require-day18
    needs:
    - baseline
  integration:
    name: 05 Runtime integration
    needs:
    - lint
    - types
    - contracts
    uses: ./.github/workflows/runtime-core.yml
  postgres:
    name: 06 Dispatcher concurrency
    needs:
    - integration
    uses: ./.github/workflows/runtime-postgres.yml
    with:
      suite: postgres
  observability:
    name: 07 Metrics and alert faults
    needs:
    - integration
    uses: ./.github/workflows/runtime-postgres.yml
    with:
      suite: observability
  evidence:
    name: 08 Runtime evidence verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Fail closed on all upstream results
      env:
        PIPELINE_NEEDS: ${{ toJSON(needs) }}
      run: python -m scripts.iac.pipeline_evidence needs --expected baseline,lint,types,contracts,integration,postgres,observability
    - uses: ./.github/actions/setup-ci-runtime
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: runtime-core-results
        path: .ci-inputs/runtime-core
    - run: python -m scripts.iac.pipeline_evidence consume --stage runtime-core --folder .ci-inputs/runtime-core
        --output .runtime-reports
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: runtime-postgres-results
        path: .ci-inputs/runtime-postgres
    - run: python -m scripts.iac.pipeline_evidence consume --stage runtime-postgres --folder .ci-inputs/runtime-postgres
        --output .runtime-reports
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: runtime-observability-results
        path: .ci-inputs/runtime-observability
    - run: python -m scripts.iac.pipeline_evidence consume --stage runtime-observability --folder .ci-inputs/runtime-observability
        --output .runtime-reports
    - run: |-
        python -m scripts.day12_evidence
        python -m scripts.day16_evidence --check-existing
        python -m scripts.day17_release --check-existing
        python -m scripts.day18_evidence --check-existing
        python -m scripts.day19_evidence --check-existing
        python -m scripts.day24_evidence --check-existing
        python -m scripts.iac.day31_evidence --runtime
      name: Revalidate transported Runtime evidence
    - name: Day34 exact-source quality checks
      run: python -m scripts.day34_evidence --quality
    - name: Day34 vertical acceptance (fail closed)
      if: ${{ always() }}
      env:
        PIPELINE_NEEDS: ${{ toJSON(needs) }}
      run: python -m scripts.day34_evidence
    - name: Upload Day34 acceptance and check logs
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day34-vertical-acceptance
        path: .runtime-reports/day34-*
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - name: Day35 fault and evidence admission
      env:
        PIPELINE_NEEDS: ${{ toJSON(needs) }}
      run: |
        python -m scripts.day35_evidence
        python -m scripts.day35_evidence --check-existing
    - name: Upload Day35 runtime acceptance
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day35-runtime-acceptance
        path: |
          .runtime-reports/day35-runtime-faults.xml
          .runtime-reports/day35-acceptance.json
        if-no-files-found: error
        retention-days: 7
    - run: python -m scripts.iac.pipeline_evidence publish --stage runtime-evidence --folder .runtime-reports --output
        .ci-bundles/runtime-evidence
      name: Seal runtime-evidence candidate / attempt / hashes
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: runtime-verified-evidence
        path: .ci-bundles/runtime-evidence
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    needs:
    - baseline
    - lint
    - types
    - contracts
    - integration
    - postgres
    - observability
    if: ${{ always() }}
    env:
      DAY12_EVIDENCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
      DAY16_EVIDENCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
      DAY24_EVIDENCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
  runtime:
    name: Runtime quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Fail closed on all upstream results
      env:
        PIPELINE_NEEDS: ${{ toJSON(needs) }}
      run: python -m scripts.iac.pipeline_evidence needs --expected evidence
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: runtime-verified-evidence
        path: .ci-inputs/runtime-evidence
    - run: python3 -m scripts.iac.pipeline_evidence verify --stage runtime-evidence --folder .ci-inputs/runtime-evidence
    - name: Require Day35 acceptance from this candidate and attempt
      run: |
        python3 - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        root = Path('.ci-inputs/runtime-evidence')
        proof = json.loads((root / 'day35-acceptance.json').read_text())
        expected_run = os.environ['GITHUB_RUN_ID'] + ':' + os.environ['GITHUB_RUN_ATTEMPT']
        if not (
            proof['decision'] == 'READY_FOR_LOCAL_REVIEW'
            and proof['ci_verified'] is True
            and proof['release_authorized'] is False
            and proof['real_aws_verified'] is False
            and proof['physical_boot_verified'] is False
            and proof['provenance']['commit'] == os.environ['GITHUB_SHA']
            and proof['provenance']['run_id'] == expected_run
            and set(proof['proofs']) == {'day35-runtime-faults.xml', 'day34-acceptance.json'}
            and all(hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
                    for name, digest in proof['proofs'].items())
        ):
            raise SystemExit('BLOCKED: Day35 acceptance/source/run/hash mismatch')
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day31-runtime-trust
        path: |-
          .ci-inputs/runtime-evidence/day31-runtime-baseline.json
          .ci-inputs/runtime-evidence/day31-runtime.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    needs:
    - evidence
    if: ${{ always() }}
