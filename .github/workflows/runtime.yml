name: Runtime quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Lint and check types
        run: |
          ruff check .
          ruff format --check .
          mypy .
      - name: Module boundaries and baseline schema compatibility
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PR_BASE:-${QUEUE_BASE:-${PUSH_BASE:-HEAD}}}"
          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then base=HEAD; fi
          baseline=$(mktemp -d)
          git archive "$base" | tar -x -C "$baseline"
          python -m scripts.contracts --baseline "$baseline"
      - name: Unit, contract, real permissions and independent-process E2E tests
        run: pytest tests/unit tests/contract tests/e2e/test_independent_runtimes.py tests/integration/security/test_database_runtime_permissions.py -q
