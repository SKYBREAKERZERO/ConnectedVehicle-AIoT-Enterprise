name: Day35 full OTA acceptance
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  # Distinct from the called Runtime group, including for the same PR.
  group: day35-entry-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  intake:
    name: Day35 event and immutable source intake
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Bind repository, event, candidate, baseline and attempt
      run: python -m scripts.iac.ci_baseline_policy --output .day35-intake/day35-intake.json
    - name: Seal intake without credentials or deployment State
      run: python -m scripts.iac.pipeline_evidence publish --stage day35-intake --folder .day35-intake --output .day35-sealed-intake
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day35-intake-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day35-sealed-intake
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  acceptance:
    name: Complete Day35 verification chain
    needs: [intake]
    # Same-commit reusable workflow: baseline -> lint/types/contracts -> real
    # Runtime -> PostgreSQL/observability faults -> Day35 evidence -> Runtime gate.
    uses: ./.github/workflows/runtime.yml
  day35:
    name: Day35 full acceptance gate
    needs: [intake, acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DAY16_EVIDENCE_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/setup-ci-runtime
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ needs.intake.result == 'success' && needs.acceptance.result == 'success' }}
      with:
        name: day35-intake-${{ github.run_id }}-${{ github.run_attempt }}
        path: .day35-intake-input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ needs.intake.result == 'success' && needs.acceptance.result == 'success' }}
      with:
        name: runtime-verified-evidence
        path: .day35-input
    - name: Evaluate Day35 evidence and write fail-closed decision
      if: ${{ always() }}
      env:
        PIPELINE_NEEDS: ${{ toJSON(needs) }}
      run: python -m scripts.day35_workflow_gate
    - name: Upload final Day35 workflow result
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day35-workflow-result-${{ github.run_id }}-${{ github.run_attempt }}
        path: day35-workflow-result.json
        if-no-files-found: error
        retention-days: 7
