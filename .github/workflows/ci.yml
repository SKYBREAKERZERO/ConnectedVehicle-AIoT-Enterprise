name: IaC quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: IaC quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          persist-credentials: false
      - name: Select baseline commit
        id: baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
          DEFAULT_REF: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          baseline="${PR_BASE:-${QUEUE_BASE:-${PUSH_BASE:-$DEFAULT_REF}}}"
          if [[ "$baseline" == "0000000000000000000000000000000000000000" ]]; then
            baseline="$GITHUB_SHA"
          fi
          echo "ref=$baseline" >> "$GITHUB_OUTPUT"
      - name: Checkout baseline into separate directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.7'
          terraform_wrapper: false
      - name: Install pinned IaC tools
        working-directory: candidate
        run: python -m pip install --disable-pip-version-check -r scripts/iac/requirements.txt
      - name: Test policy regressions and gate code
        working-directory: candidate
        run: |
          ruff check scripts/iac tests/unit/iac
          ruff format --check scripts/iac tests/unit/iac
          mypy scripts/iac
          pytest -c scripts/iac/pytest.ini tests/unit/iac -q
      - name: Validate, scan, contract-test and check baseline plan
        working-directory: candidate
        run: python -m scripts.iac.gate --baseline ../baseline
      - name: Upload sanitized success summary
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iac-gate-summary
          path: candidate/.iac-reports/summary.json
          if-no-files-found: error
          retention-days: 7
