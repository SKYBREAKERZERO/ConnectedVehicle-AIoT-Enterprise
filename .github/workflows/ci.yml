name: IaC quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: IaC quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Select baseline commit
        id: baseline
        working-directory: candidate
        run: python3 -m scripts.iac.ci_baseline_policy --output .iac-reports/day31-baseline.json
      - name: Checkout baseline into separate directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.7'
          terraform_wrapper: false
      - name: Install pinned IaC tools
        working-directory: candidate
        run: python -m pip install --disable-pip-version-check -r scripts/iac/requirements.txt
      - name: Test policy regressions and gate code
        working-directory: candidate
        run: |
          ruff check scripts/iac tests/unit/iac tests/integration/iac
          ruff format --check scripts/iac tests/unit/iac tests/integration/iac
          mypy scripts/iac
          pytest -c scripts/iac/pytest.ini tests/unit/iac -q --junitxml=.iac-reports/day25-security.xml
          python -m scripts.iac.deploy_governance
          python -m scripts.iac.day26_evidence
          python -m scripts.iac.day27_evidence
      - name: Validate, scan, contract-test and check baseline plan
        working-directory: candidate
        run: python -m scripts.iac.gate --baseline ../baseline
      - name: Verify Day27 native lock interruption evidence
        working-directory: candidate
        run: python -m scripts.iac.day27_evidence --with-fault
      - name: Verify Day28 recovery and evidence
        working-directory: candidate
        run: python -m scripts.iac.day28_evidence --verify
      - name: Verify Day29 trusted registry recovery and revalidation evidence
        working-directory: candidate
        run: python -m scripts.iac.day29_evidence --verify
      - name: Verify Day30 failure isolation and reconciliation evidence
        working-directory: candidate
        run: python -m scripts.iac.day30_evidence --verify
      - name: Verify Day31 event baseline and mandatory trust proof
        working-directory: candidate
        run: python -m scripts.iac.day31_evidence --verify
      - name: Upload sanitized success summary
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iac-gate-summary
          path: candidate/.iac-reports/summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Day31 candidate trust evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day31-iac-trust
          path: |
            candidate/.iac-reports/day31-baseline.json
            candidate/.iac-reports/day31-governance.json
            candidate/.iac-reports/day25-security.xml
            candidate/.iac-reports/day31-faults.xml
            candidate/.iac-reports/day31-faults.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Day26 offline state and plan governance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day26-state-plan-governance
          path: |
            candidate/.iac-reports/day26-governance.json
            candidate/.iac-reports/day25-security.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Day25 deployment governance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day25-deploy-governance
          path: |
            candidate/.iac-reports/day25-governance.json
            candidate/.iac-reports/day25-security.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Day27 release recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day27-release-recovery
          path: |
            candidate/.iac-reports/day27-governance.json
            candidate/.iac-reports/day25-security.xml
            candidate/.iac-reports/day27-lock.xml
            candidate/.iac-reports/day27-lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Day28 disaster recovery and drift evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day28-state-drift-recovery
          path: |
            candidate/.iac-reports/day28-governance.json
            candidate/.iac-reports/day25-security.xml
            candidate/.iac-reports/day28-dr.xml
            candidate/.iac-reports/day28-dr.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Day30 failure isolation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day30-failure-isolation
          path: |
            candidate/.iac-reports/day30-governance.json
            candidate/.iac-reports/day25-security.xml
            candidate/.iac-reports/day30-faults.xml
            candidate/.iac-reports/day30-faults.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Day29 trusted recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: day29-trusted-recovery
          path: |
            candidate/.iac-reports/day29-governance.json
            candidate/.iac-reports/day25-security.xml
            candidate/.iac-reports/day29-native.xml
            candidate/.iac-reports/day29-native.json
            candidate/.iac-reports/day29-faults.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
