name: Day37 manual Bootstrap reconciliation (no automatic repair)
'on':
  workflow_dispatch:
    inputs:
      release_commit:
        description: Current protected main HEAD SHA
        required: true
        type: string
      prior_commit:
        description: Commit of failed Bootstrap fence
        required: true
        type: string
      prior_run_id:
        description: GitHub Run ID of failed Bootstrap fence
        required: true
        type: string
      prior_attempt:
        description: GitHub Run Attempt of failed Bootstrap fence
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: day37-aws-staging-exclusive
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  bootstrap_reconcile:
    name: Independently reconcile previous Bootstrap after approved repair
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: aws-staging-recovery
    permissions:
      contents: read
      id-token: write
    env:
      DAY37_ROLE_ARN: ${{ vars.DAY37_RECOVERY_ROLE_ARN }}
      DAY37_ACCOUNT_ID: ${{ vars.DAY37_ACCOUNT_ID }}
      DAY37_BACKEND_BUCKET: ${{ vars.DAY37_BACKEND_BUCKET }}
      DAY37_BACKEND_KEY: ${{ vars.DAY37_BACKEND_KEY }}
      DAY37_BACKEND_KMS_ARN: ${{ vars.DAY37_BACKEND_KMS_ARN }}
      TF_VAR_aws_account_id: ${{ vars.DAY37_ACCOUNT_ID }}
      TF_VAR_aws_region: ap-northeast-1
      TF_VAR_vpc_id: ${{ vars.DAY37_VPC_ID }}
      TF_VAR_private_subnet_ids: ${{ vars.DAY37_PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_alb_security_group_id: ${{ vars.DAY37_ALB_SG_ID }}
      TF_VAR_database_security_group_id: ${{ vars.DAY37_DATABASE_SG_ID }}
      TF_VAR_redis_security_group_id: ${{ vars.DAY37_REDIS_SG_ID }}
      TF_VAR_alb_target_group_arn: ${{ vars.DAY37_TARGET_GROUP_ARN }}
      TF_VAR_application_database_secret_arn: ${{ vars.DAY37_APP_DB_SECRET_ARN }}
      TF_VAR_tenant_id: ${{ vars.DAY37_TENANT_ID }}
      TF_VAR_oidc_issuer: ${{ vars.DAY37_APP_OIDC_ISSUER }}
      TF_VAR_oidc_jwks_url: ${{ vars.DAY37_APP_OIDC_JWKS_URL }}
      TF_VAR_oidc_audience: ${{ vars.DAY37_APP_OIDC_AUDIENCE }}
      TF_VAR_redis_host: ${{ vars.DAY37_REDIS_HOST }}
      TF_VAR_redis_auth_secret_arn: ${{ vars.DAY37_REDIS_AUTH_SECRET_ARN }}
      DAY37_ECR_REPOSITORY: ${{ vars.DAY37_ECR_REPOSITORY }}
      DAY37_CLUSTER: ${{ vars.DAY37_CLUSTER }}
      DAY37_SERVICE: ${{ vars.DAY37_SERVICE }}
      DAY37_ALB_TARGET_GROUP_ARN: ${{ vars.DAY37_TARGET_GROUP_ARN }}
      DAY37_PLAN_BUCKET: ${{ vars.DAY37_PLAN_BUCKET }}
      DAY37_PLAN_PREFIX: ${{ vars.DAY37_PLAN_PREFIX }}
      DAY37_PLAN_KMS_ARN: ${{ vars.DAY37_PLAN_KMS_ARN }}
      TF_VAR_enable_service: 'false'
      TF_VAR_desired_count: '0'
      RECONCILE_COMMIT: ${{ inputs.release_commit }}
      RECONCILE_PRIOR_COMMIT: ${{ inputs.prior_commit }}
      RECONCILE_PRIOR_RUN: ${{ inputs.prior_run_id }}
      RECONCILE_PRIOR_ATTEMPT: ${{ inputs.prior_attempt }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/setup-ci-runtime
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      with:
        terraform_version: 1.14.7
        terraform_wrapper: false
    - name: Verify protected main and previous run identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' && "$GITHUB_EVENT_NAME" == ''workflow_dispatch'' ]]

        [[ "$GITHUB_SHA" == "$RECONCILE_COMMIT" && "$RECONCILE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

        [[ "$RECONCILE_PRIOR_COMMIT" =~ ^[0-9a-f]{40}$ && "$RECONCILE_PRIOR_RUN" =~ ^[1-9][0-9]*$ && "$RECONCILE_PRIOR_ATTEMPT" =~ ^[1-9][0-9]*$
        ]]

        HEAD=$(gh api repos/SKYBREAKERZERO/ConnectedVehicle-AIoT-Enterprise/branches/main --jq .commit.sha)

        [[ "$HEAD" == "$GITHUB_SHA" ]] || { echo ''BLOCKED: protected main changed'' >&2; exit 1; }

        python -m scripts.day37_preflight config --mode recovery

        '
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-region: ap-northeast-1
        role-to-assume: ${{ env.DAY37_ROLE_ARN }}
        role-session-name: day37-bootstrap-manual-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: 1800
    - name: Verify AWS recovery Role
      run: python -m scripts.day37_preflight live --mode recovery
    - name: Read ACTIVE fence, prove zero drift, live AWS, CAS close
      run: "set -euo pipefail\numask 077\nmkdir -p .day37/bootstrap-manual\npython -m scripts.day37_fence read-fence --output .day37/bootstrap-manual/fence.json\n\
        python - <<'PYCODE'\nimport os\nfrom scripts.day37_fence import load, require\nrecord = load('.day37/bootstrap-manual/fence.json')\nrequire(record.get('phase')\
        \ == 'bootstrap','only Bootstrap fence may be reconciled here')\nfor key, label in [('commit','RECONCILE_PRIOR_COMMIT'),('run_id','RECONCILE_PRIOR_RUN'),('run_attempt','RECONCILE_PRIOR_ATTEMPT')]:\n\
        \    require(str(record.get(key)) == os.environ[label], 'previous run differs from ACTIVE fence')\nPYCODE\nbash scripts/day37_tf.sh init\n\
        export TF_VAR_enable_service=false TF_VAR_desired_count=0\nset +e\nterraform -chdir=\"${DAY37_TF_ROOT}\" plan -detailed-exitcode -input=false\
        \ -lock-timeout=30s -no-color -out=\"${PWD}/.day37/bootstrap-manual/no-drift.tfplan\" > .day37/bootstrap-manual/terraform-private.log\
        \ 2>&1\nRC=$?\nset -e\n[[ \"$RC\" -eq 0 ]] || { echo 'BLOCKED: partial Bootstrap Apply still unreconciled' >&2; exit 1; }\nterraform -chdir=\"\
        ${DAY37_TF_ROOT}\" show -json \"${PWD}/.day37/bootstrap-manual/no-drift.tfplan\" > .day37/bootstrap-manual/no-drift.json\npython -m scripts.day37_bootstrap_manual\
        \ --fence .day37/bootstrap-manual/fence.json --terraform-json .day37/bootstrap-manual/no-drift.json --terraform-exit-code \"$RC\" --output\
        \ .day37/bootstrap-manual/manual-proof.json\npython -m scripts.day37_fence manual-close --phase bootstrap --fence .day37/bootstrap-manual/fence.json\
        \ --proof .day37/bootstrap-manual/manual-proof.json --output .day37/bootstrap-manual/closed-fence.json\n"
    - if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: day37-bootstrap-manual-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.day37/bootstrap-manual/fence.json

          .day37/bootstrap-manual/manual-proof.json

          .day37/bootstrap-manual/closed-fence.json'
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 30
