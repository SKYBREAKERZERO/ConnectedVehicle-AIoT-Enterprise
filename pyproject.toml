[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "connected-vehicle-aiot-enterprise"
version = "0.1.0"
description = "Production-oriented Connected Vehicle IoT and AIoT Enterprise Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "aiomqtt==2.5.1",
    "PyJWT[crypto]>=2.10,<3.0",
    "prometheus-client>=0.21,<1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic==2.13.5",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "redis>=5.2,<7.0",
    "boto3>=1.35,<2.0",
    "botocore>=1.35,<2.0",
    "httpx2>=2.13,<3.0",
    "structlog>=25.1,<26.0",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
]


[project.scripts]
vehicle-api = "apps.api.__main__:main"
vehicle-outbox = "apps.outbox.__main__:main"
vehicle-remote-command = "apps.remote_command.__main__:main"

[project.optional-dependencies]
dev = [
    "PyYAML==6.0.3",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "pytest-cov>=6.0,<8.0",
    "httpx2",
    "ruff==0.16.10",
    "types-PyYAML>=6.0,<7.0",
    "mypy==1.20.2",
    "boto3-stubs[s3,sqs,sns,events,kms,secretsmanager]",
]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps*",
    "connected_vehicle*",
    "enterprise_platform*",
]
exclude = [
    "tests*",
    "infra*",
    "config*",
    "database*",
    "domains*",
    "services*",
    "workers*",
    "simulators*",
    "scripts*",
    "docs*",
]
namespaces = false


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external dependencies",
    "contract: API and event contract tests",
    "e2e: end-to-end system tests",
]
asyncio_mode = "auto"


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    ".terraform",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unreachable = true
pretty = true

exclude = [
    "^\\.venv/",
]


[tool.coverage.run]
branch = true
source = [
    "apps",
    "enterprise_platform",
]


[tool.coverage.report]
show_missing = true
skip_covered = false