# Disposable local staging only. No external State, credentials or fixed names.
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ${DAY36_DB_PASSWORD:?generated local password required}
    ports: ["127.0.0.1::5432"]
    volumes: ["database:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: secretsmanager,sqs
      AWS_DEFAULT_REGION: ap-northeast-1
    ports: ["127.0.0.1::4566"]
  blue: &api
    image: ${DAY36_BASELINE_IMAGE:?immutable baseline image ID required}
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    ports: ["127.0.0.1::8000"]
    environment: &runtime
      APP_ENV: local
      CLOUD_RUNTIME: localstack
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
      APPLICATION_DATABASE_SECRET_ID: day36-application
      DATABASE_TENANT_ID: ${DAY36_TENANT:?isolated tenant required}
      OIDC_ISSUER: https://day36.local.invalid
      OIDC_AUDIENCE: day36-staging
      OIDC_PUBLIC_KEY_FILE: /run/day36/public.pem
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TRACING_ENABLED: "false"
    volumes:
      - type: bind
        source: ${DAY36_PUBLIC_KEY:?local test public key required}
        target: /run/day36/public.pem
        read_only: true
  green:
    <<: *api
    image: ${DAY36_CANDIDATE_IMAGE:?immutable candidate image ID required}
volumes:
  database:
