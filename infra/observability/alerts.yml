groups:
  - name: connected-vehicle-api
    rules:
      - alert: VehicleAPIUnavailable
        expr: up{job="vehicle-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Vehicle API cannot be scraped
      - alert: VehicleAPIErrorRatio
        expr: sum(rate(vehicle_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(vehicle_http_requests_total[5m])), 0.01) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Vehicle API error ratio exceeds five percent
      - alert: VehicleAPIHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(vehicle_http_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Vehicle API p95 latency exceeds one second

  - name: local-runtime-safety
    rules:
      - alert: DeviceAuthenticationBlocked
        expr: vehicle_auth_blocked_reports > 0
        labels: {severity: critical}
        annotations: {summary: Repair credentials and perform audited report replay}
      - alert: VehicleCommandOrderStalled
        expr: vehicle_stalled_vehicles > 0
        for: 10s
        labels: {severity: critical}
        annotations: {summary: Reconcile unknown execution before releasing the vehicle queue}
      - alert: DeviceLedgerCapacityWarning
        expr: vehicle_ledger_utilization_ratio > 0.8
        labels: {severity: warning}
        annotations: {summary: Schedule bounded online ledger archival}
      - alert: RuntimeReportDeliveryStalled
        expr: vehicle_report_oldest_age_seconds > 300
        labels: {severity: warning}
        annotations: {summary: Device reports exceed delivery SLA}
      - alert: RuntimeCollectorUnavailable
        expr: vehicle_monitor_collection_success == 0 or up{job="local-runtime"} == 0
        for: 10s
        labels: {severity: critical}
        annotations: {summary: Operational collection stopped or is stale}
