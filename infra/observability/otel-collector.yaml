receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch: {}
exporters:
  otlphttp:
    endpoint: ${env:TRACE_BACKEND_ENDPOINT}
    headers:
      Authorization: ${env:TRACE_BACKEND_AUTHORIZATION}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp]
