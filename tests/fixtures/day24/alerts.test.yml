rule_files:
- ../../../infra/observability/day24-campaign.yml
evaluation_interval: 1m
tests:
- name: CampaignCollectorUnavailable-pending-firing-resolved
  interval: 1m
  input_series:
  - series: up{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_enabled{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_collection_success{job="vehicle-api",instance="api:8000"}
    values: 0+0x5 1+0x6
  alert_rule_test:
  - eval_time: 0m
    alertname: CampaignCollectorUnavailable
    exp_alerts: []
  - eval_time: 3m
    alertname: CampaignCollectorUnavailable
    exp_alerts:
    - exp_labels:
        job: vehicle-api
        instance: api:8000
        severity: critical
      exp_annotations:
        summary: Campaign state collection is unavailable
        runbook_url: https://github.com/SKYBREAKERZERO/ConnectedVehicle-AIoT-Enterprise/blob/main/docs/DAY24_CAMPAIGN_OBSERVABILITY.md#collector-unavailable
  - eval_time: 8m
    alertname: CampaignCollectorUnavailable
    exp_alerts: []
- name: CampaignWaveOverdue-pending-firing-resolved
  interval: 1m
  input_series:
  - series: up{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_enabled{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_collection_success{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_waves{job="vehicle-api",instance="api:8000",state="overdue"}
    values: 1+0x5 0+0x6
  alert_rule_test:
  - eval_time: 0m
    alertname: CampaignWaveOverdue
    exp_alerts: []
  - eval_time: 3m
    alertname: CampaignWaveOverdue
    exp_alerts:
    - exp_labels:
        job: vehicle-api
        instance: api:8000
        severity: warning
      exp_annotations:
        summary: Campaign wave exceeded its configured timeout
        runbook_url: https://github.com/SKYBREAKERZERO/ConnectedVehicle-AIoT-Enterprise/blob/main/docs/DAY24_CAMPAIGN_OBSERVABILITY.md#wave-overdue
  - eval_time: 8m
    alertname: CampaignWaveOverdue
    exp_alerts: []
- name: CampaignClaimExpired-pending-firing-resolved
  interval: 1m
  input_series:
  - series: up{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_enabled{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_collection_success{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_claims{job="vehicle-api",instance="api:8000",state="expired"}
    values: 1+0x5 0+0x6
  alert_rule_test:
  - eval_time: 0m
    alertname: CampaignClaimExpired
    exp_alerts: []
  - eval_time: 3m
    alertname: CampaignClaimExpired
    exp_alerts:
    - exp_labels:
        job: vehicle-api
        instance: api:8000
        severity: warning
      exp_annotations:
        summary: Campaign dispatcher lease requires recovery
        runbook_url: https://github.com/SKYBREAKERZERO/ConnectedVehicle-AIoT-Enterprise/blob/main/docs/DAY24_CAMPAIGN_OBSERVABILITY.md#claim-expired
  - eval_time: 8m
    alertname: CampaignClaimExpired
    exp_alerts: []
- name: CampaignJobsFailed-pending-firing-resolved
  interval: 1m
  input_series:
  - series: up{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_enabled{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_collection_success{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_job_failures{job="vehicle-api",instance="api:8000",state="recent"}
    values: 1+0x5 0+0x6
  alert_rule_test:
  - eval_time: 0m
    alertname: CampaignJobsFailed
    exp_alerts: []
  - eval_time: 3m
    alertname: CampaignJobsFailed
    exp_alerts:
    - exp_labels:
        job: vehicle-api
        instance: api:8000
        severity: warning
      exp_annotations:
        summary: Campaign jobs failed within the last five minutes
        runbook_url: https://github.com/SKYBREAKERZERO/ConnectedVehicle-AIoT-Enterprise/blob/main/docs/DAY24_CAMPAIGN_OBSERVABILITY.md#jobs-failed
  - eval_time: 8m
    alertname: CampaignJobsFailed
    exp_alerts: []
- name: failed-collection-suppresses-stale-business-gauges
  interval: 1m
  input_series:
  - series: vehicle_ota_collection_success{job="vehicle-api",instance="api:8000"}
    values: 0+0x12
  - series: vehicle_ota_waves{job="vehicle-api",instance="api:8000",state="overdue"}
    values: 1+0x12
  - series: vehicle_ota_claims{job="vehicle-api",instance="api:8000",state="expired"}
    values: 1+0x12
  - series: vehicle_ota_job_failures{job="vehicle-api",instance="api:8000",state="recent"}
    values: 1+0x12
  alert_rule_test:
  - eval_time: 5m
    alertname: CampaignWaveOverdue
    exp_alerts: []
  - eval_time: 5m
    alertname: CampaignClaimExpired
    exp_alerts: []
  - eval_time: 5m
    alertname: CampaignJobsFailed
    exp_alerts: []
- name: scrape-down-fires-and-recovers
  interval: 1m
  input_series:
  - series: vehicle_ota_enabled{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: up{job="vehicle-api",instance="api:8000"}
    values: 0+0x5 1+0x6
  - series: vehicle_ota_collection_success{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  alert_rule_test:
  - eval_time: 3m
    alertname: CampaignCollectorUnavailable
    exp_alerts:
    - exp_labels:
        job: vehicle-api
        instance: api:8000
        severity: critical
      exp_annotations: &id001
        summary: Campaign state collection is unavailable
        runbook_url: https://github.com/SKYBREAKERZERO/ConnectedVehicle-AIoT-Enterprise/blob/main/docs/DAY24_CAMPAIGN_OBSERVABILITY.md#collector-unavailable
  - eval_time: 8m
    alertname: CampaignCollectorUnavailable
    exp_alerts: []
- name: missing-collection-series-fires-and-recovers
  interval: 1m
  input_series:
  - series: vehicle_ota_enabled{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: up{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_collection_success{job="vehicle-api",instance="api:8000"}
    values: _ _ _ _ _ _ 1+0x6
  alert_rule_test:
  - eval_time: 3m
    alertname: CampaignCollectorUnavailable
    exp_alerts:
    - exp_labels:
        job: vehicle-api
        instance: api:8000
        severity: critical
      exp_annotations: *id001
  - eval_time: 8m
    alertname: CampaignCollectorUnavailable
    exp_alerts: []
- name: disabled-monitoring-does-not-page
  interval: 1m
  input_series:
  - series: up{job="vehicle-api",instance="api:8000"}
    values: 1+0x12
  - series: vehicle_ota_enabled{job="vehicle-api",instance="api:8000"}
    values: 0+0x12
  - series: vehicle_ota_collection_success{job="vehicle-api",instance="api:8000"}
    values: 0+0x12
  alert_rule_test:
  - eval_time: 5m
    alertname: CampaignCollectorUnavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: CampaignWaveOverdue
    exp_alerts: []
  - eval_time: 5m
    alertname: CampaignClaimExpired
    exp_alerts: []
  - eval_time: 5m
    alertname: CampaignJobsFailed
    exp_alerts: []
- name: healthy-other-instance-cannot-authorize-stale-wave-metrics
  interval: 1m
  input_series:
  - series: vehicle_ota_waves{job="vehicle-api",instance="bad:8000",state="overdue"}
    values: 1+0x12
  - series: vehicle_ota_collection_success{job="vehicle-api",instance="good:8000"}
    values: 1+0x12
  alert_rule_test:
  - eval_time: 5m
    alertname: CampaignWaveOverdue
    exp_alerts: []
